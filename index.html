    function AnalysisEditModal({ issue, onClose, onSave, isUploading }) {
      const [analysis, setAnalysis] = useState(issue.aiAnalysis?.analysis || '');
      const [policy, setPolicy] = useState(issue.aiAnalysis?.policyRecommendation || '');
      const [publication, setPublication] = useState(issue.aiAnalysis?.publicationRecommendation || '');

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-3xl shadow-2xl overflow-hidden flex flex-col max-h-[95vh]">
            <div className="bg-amber-500 px-6 py-4 flex justify-between items-center text-white"><h3 className="text-base font-bold flex items-center"><Edit2 size={16} className="mr-2"/> Edit Manual Analisis & Rekomendasi</h3><button onClick={onClose} className="hover:text-amber-200"><X size={18} /></button></div>
            <div className="p-6 overflow-y-auto custom-scrollbar space-y-4">
               <div><label className="block text-[11px] font-bold text-slate-700 mb-1">Deskripsi Analisis Isu</label><textarea rows="5" value={analysis} onChange={e => setAnalysis(e.target.value)} className="w-full px-3 py-2 text-sm border rounded-xl outline-none"></textarea></div>
               <div><label className="block text-[11px] font-bold text-slate-700 mb-1">Rekomendasi Kebijakan</label><textarea rows="5" value={policy} onChange={e => setPolicy(e.target.value)} className="w-full px-3 py-2 text-sm border rounded-xl outline-none"></textarea></div>
               <div><label className="block text-[11px] font-bold text-slate-700 mb-1">Rekomendasi Publikasi</label><textarea rows="5" value={publication} onChange={e => setPublication(e.target.value)} className="w-full px-3 py-2 text-sm border rounded-xl outline-none"></textarea></div>
            </div>
            <div className="bg-slate-50 border-t p-4 flex justify-end gap-2"><button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-200 font-bold rounded-xl">Batal</button><button onClick={() => onSave(issue.id, { analysis, policyRecommendation: policy, publicationRecommendation: publication })} disabled={isUploading} className="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold rounded-xl flex items-center">{isUploading ? <Loader2 size={16} className="animate-spin mr-1.5"/> : <Save size={16} className="mr-1.5"/>} Simpan Perubahan</button></div>
          </div>
        </div>
      );

    function App() {
      const [user, setUser] = useState(null);
      const [userRole, setUserRole] = useState('pd'); // pd, admin, pimpinan
      const [userProfile, setUserProfile] = useState(null);
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [issues, setIssues] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      
      const [isIssueModalOpen, setIsIssueModalOpen] = useState(false);
      const [editingIssue, setEditingIssue] = useState(null);
      const [viewingIssue, setViewingIssue] = useState(null);
      const [handlingIssue, setHandlingIssue] = useState(null);
      const [analyzingId, setAnalyzingId] = useState(null);
      const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
      const [isUploading, setIsUploading] = useState(false);
      const [showNotifPanel, setShowNotifPanel] = useState(false);
      const [editingAnalysisIssue, setEditingAnalysisIssue] = useState(null);
      const [potensiIsuList, setPotensiIsuList] = useState([]);
      const [isFetchingNews, setIsFetchingNews] = useState(false);
      const [fetchedNewsList, setFetchedNewsList] = useState([]);
      const [confirmDialog, setConfirmDialog] = useState(null);

      const showToast = (message, type = 'info') => {
        setToast({ show: true, message: typeof message === 'string' ? message : "Terjadi kesalahan", type });
        setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 4000);
      };

      useEffect(() => {
        if (!auth) { setIsLoading(false); return; }
        let unsubProfile = null;
        
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          try {
            if (currentUser) {
              setUser(currentUser);
              const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'info');
              unsubProfile = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                  setUserRole(docSnap.data().role || 'pd');
                  setUserProfile(docSnap.data());
                } else {
                  setUserProfile(null);
                }
              });
            } else {
              setUser(null); setUserRole('pd'); setUserProfile(null);
              if (unsubProfile) unsubProfile();
            }
          } catch (err) {
            console.warn("Auth Listener Error:", err);
          } finally { 
            setIsLoading(false); 
          }
        });
        
        return () => {
          unsubscribe();
          if (unsubProfile) unsubProfile();
        };
      }, []);

      useEffect(() => {
        if (!user || !userProfile || !db) return;

        const q = collection(db, 'artifacts', appId, 'public', 'data', 'issues');

        const unsubscribeIssues = onSnapshot(q, (snapshot) => {
          let data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          
          if (userRole === 'pd') {
             data = data.filter(d => {
                const sectors = d.leadingSectors || (d.leadingSector ? [d.leadingSector] : []);
                return sectors.includes(userProfile.agency);
             });
          }

          data.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

          const actualIssues = data.filter(d => !['SETTING_POTENSI_ISU_DATA', 'SETTING_POTENSI_MINGGUAN'].includes(d.id));
          setIssues(actualIssues);
        }, (error) => { 
            console.error("Firestore error:", error);
        });

        const docRefPotensi = doc(db, 'artifacts', appId, 'public', 'data', 'issues', 'SETTING_POTENSI_ISU_DATA');
        const unsubscribePotensi = onSnapshot(docRefPotensi, (docSnap) => {
          if (docSnap.exists()) {
             setPotensiIsuList(docSnap.data().data || []);
          } else {
             setPotensiIsuList([]);
          }
        }, (err) => console.warn("Read rules blocked Potensi Isu:", err));

        return () => {
          unsubscribeIssues();
          unsubscribePotensi();
        };
      }, [user, userProfile, userRole]);

      const notifications = useMemo(() => {
        if (!userProfile) return [];
        const sorted = [...issues].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
        
        if (userRole === 'admin' || userRole === 'pimpinan') {
          return sorted.slice(0, 10);
        } 
        else {
          return sorted.filter(i => {
            const sectors = i.leadingSectors || (i.leadingSector ? [i.leadingSector] : []);
            return sectors.includes(userProfile.agency);
          }).slice(0, 10);
        }
      }, [issues, userProfile, userRole]);

      const handleLogout = async () => { if (auth) await signOut(auth); };

      const uploadFileToStorage = async (file, pathPrefix) => {
        if (!file) return null;
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = async () => {
            try {
              const response = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                  action: 'uploadFile',
                  fileName: `${pathPrefix}_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`,
                  base64Data: reader.result
                })
              });
              
              const result = await response.json();
              if (result.status === 'success') {
                resolve(result.fileUrl); 
              } else {
                let errMsg = result.message || "Gagal mengunggah ke Google Drive";
                console.error("Backend response message:", errMsg);
                if (errMsg.includes("DriveApp") || errMsg.includes("izin") || errMsg.includes("permission") || errMsg.includes("Authorization")) {
                   errMsg = "Akses Ditolak: Apps Script kekurangan izin 'DriveApp.createFolder'. Solusi: Buka editor Apps Script, tambahkan fungsi 'function PANCING() { DriveApp.createFolder(\"Test\"); }', jalankan fungsi PANCING tersebut, berikan izin, lalu wajib Deploy sebagai Versi Baru.";
                }
                reject(new Error(errMsg));
              }
            } catch (err) {
              console.error("Upload error:", err);
              reject(new Error("Gagal menghubungi server Google Drive. Cek koneksi atau deployment ID."));
            }
          };
          reader.onerror = error => reject(error);
        });
      };

      const saveIssue = async (issueData, attachmentFile) => {
        if (userRole !== 'admin') return;
        try {
          setIsUploading(true);
          let attachmentUrl = issueData.attachmentUrl || null;
          if (attachmentFile) attachmentUrl = await uploadFileToStorage(attachmentFile, 'issue');
          
          const finalData = { ...issueData, attachmentUrl, updatedAt: new Date().toISOString() };
          if (editingIssue) {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'issues', editingIssue.id), finalData);
            showToast("Diperbarui", "success");
          } else {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'issues'), { ...finalData, status: 'Belum Ditangani', createdAt: new Date().toISOString() });
            showToast("Ditambahkan", "success");
          }
          setIsIssueModalOpen(false); setEditingIssue(null);
        } catch (error) { showToast(error.message || "Gagal", "error"); } finally { setIsUploading(false); }
      };

      const savePotensiIsu = async (updatedArray) => {
        if (userRole !== 'admin') return;
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'issues', 'SETTING_POTENSI_ISU_DATA'), {
            isSetting: true,
            data: updatedArray,
            updatedAt: new Date().toISOString()
          }, { merge: true });

      const handleAnalyzeAI = async (issue) => {
        if (userRole !== 'admin') return;
        
        if (!OPENAI_API_KEY || OPENAI_API_KEY.includes("MASUKKAN")) {
            showToast("OpenAI API Key belum diatur di kode.", "error");
            return;
        }

        setAnalyzingId(issue.id); showToast("AI sedang menganalisis (mohon tunggu)...", "info");
        
        try {
          const sectorsStr = (issue.leadingSectors || [issue.leadingSector]).filter(Boolean).join(', ');
          
          let additionalContext = '';
          if (issue.sourceType === 'Media Sosial' && issue.comments && issue.comments.length > 0) {
              const commentsStr = issue.comments.map((c, i) => `${i+1}. [${c.sentiment}] @${c.account || 'anonim'}: ${c.content}`).join('\n');
              additionalContext = `\n\nKomentar Netizen:\n${commentsStr}`;
          }

          const prompt = `Sebagai analis kebijakan ahli Pemerintah Kota Bandung, analisislah isu berikut:
Judul: ${issue.title}
Detail: ${issue.content || issue.caption || 'Tidak ada detail'}
Sektor: ${sectorsStr}${additionalContext}

Tugas Anda:
1. Buat 'analysis' (Analisis Isu) SECARA DESKRIPTIF PERSIS DUA PARAGRAF. Paragraf 1: Menjelaskan konteks isu secara komprehensif. Paragraf 2: Menjelaskan secara tegas dampak jika tidak segera ditindaklanjuti. Gunakan karakter newline (\\n\\n) untuk memisahkan.
2. Buat 'policyRecommendation' (Rekomendasi Kebijakan) operasional. Berupa daftar bernomor diawali "Me...".
3. Buat 'publicationRecommendation' (Rekomendasi Publikasi). Berupa daftar bernomor diawali "Me...".

Format KELUARAN HARUS berupa JSON murni dengan struktur: 
{"analysis": "Paragraf 1...\\n\\nParagraf 2...", "policyRecommendation": "1. Me...\\n2. Me...", "publicationRecommendation": "1. Me...\\n2. Me..."}`;

          let rawContent = "";
          
          try {
            if (OPENAI_API_KEY && OPENAI_API_KEY.startsWith("sk-")) {
                const res = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: "You are a helpful policy analyst assistant. Always respond with raw valid JSON." },
                            { role: "user", content: prompt }
                        ],
                        response_format: { type: "json_object" }
                    })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);
                rawContent = data.choices[0].message.content;
            } else {
                throw new Error("OpenAI Key tidak ada, gunakan fallback.");
            }
          } catch (err) {
              console.warn("Mencoba AI Cadangan (Gemini)...", err.message);
              const apiKey = ""; 
              const geminiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                      contents: [{ parts: [{ text: prompt }] }],
                      generationConfig: {
                          responseMimeType: "application/json",
                          responseSchema: {
                              type: "OBJECT",
                              properties: { analysis: { type: "STRING" }, policyRecommendation: { type: "STRING" }, publicationRecommendation: { type: "STRING" } },
                              required: ["analysis", "policyRecommendation", "publicationRecommendation"]
                          }
                      }
                  })
              });
              const geminiData = await geminiRes.json();
              if (geminiData.error) throw new Error(geminiData.error.message);
              rawContent = geminiData.candidates?.[0]?.content?.parts?.[0]?.text || "";
          }

          let safeText = String(rawContent || "").trim();
          safeText = safeText.replace(/```json/gi, '').replace(/```/g, '').trim();
          
          const startIdx = safeText.indexOf('{');
          const endIdx = safeText.lastIndexOf('}');
          if (startIdx !== -1 && endIdx !== -1) {
              safeText = safeText.substring(startIdx, endIdx + 1);
          } else {
              safeText = "{}"; 
          }

          let aiResult = JSON.parse(safeText);
          
          if (!aiResult.analysis || !aiResult.policyRecommendation) {
              throw new Error("AI mengembalikan hasil kosong atau format tidak sesuai.");
          }

          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'issues', issue.id), { 
              aiAnalysis: aiResult, 
              analyzedAt: new Date().toISOString() 
          });
          
          showToast("Analisis AI selesai", "success");
          
        } catch (e) { 
            console.error("Detail Error Analisis:", e);
            showToast("Gagal analisis: " + (e.message || "Kesalahan sistem."), "error"); 
        } finally { 
            setAnalyzingId(null); 
        }

              </table>
              <br/>
              <h3 style="font-family: sans-serif;">4. Daftar Isu Lengkap</h3>
              <table border="1" cellpadding="5" cellspacing="0" style="border-collapse: collapse; width: 100%; font-family: sans-serif; font-size: 14px;">
                  <tr style="background-color: #f1f5f9;">
                      <th>No</th><th>Tanggal</th><th>Judul Isu</th><th>Sentimen</th><th>Media</th>
                  </tr>
                  ${filteredIssues.map((issue, idx) => `
                      <tr>
                          <td align="center">${idx + 1}</td>
                          <td>${issue.date}</td>
                          <td>${issue.title}</td>
                          <td align="center">${issue.sentiment}</td>
                          <td align="center">${issue.sourceType}</td>
                      </tr>
                  `).join('')}
              </table>
          `;

          const html = header + content + footer;
          const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'Rekapitulasi_Data_Isu.doc';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
      };

      const handleSendWA = (issue) => {
        const dateObj = new Date(issue.date);
        const dateStr = dateObj.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        let text = `Yth. Bapak Wali Kota Bandung\ndi tempat.\n\nMohon izin menyampaikan terkait isu yang berkembang berkaitan dengan Pemerintah Kota Bandung, pada hari ${dateStr}.\n\n`;
        
        text += `*Ringkasan Isu:*\n${issue.title}\n`;
        
        const links = (issue.links || [issue.link]).filter(Boolean);
        if (links.length > 0) {
          text += `\n*Sumber Berita / Referensi:*\n${links.map((l, i) => `${i+1}. ${issue.sourceType}: ${l}`).join('\n')}\n\n`;
        } else {
          text += `\n*Sumber Berita / Referensi:*\n1. ${issue.sourceType} ${issue.platforms?.length ? '(' + issue.platforms.filter(Boolean).join(', ') + ')' : ''}\n\n`;
        }
        
        if (issue.aiAnalysis) {
          text += `*1. Analisis Isu:*\n${issue.aiAnalysis.analysis}\n\n`;
          text += `*2. Rekomendasi Kebijakan:*\n${issue.aiAnalysis.policyRecommendation}\n\n`;
          text += `*3. Rekomendasi Publikasi:*\n${issue.aiAnalysis.publicationRecommendation}\n\n`;
        }
        
        text += `Demikian analisis isu yang dapat Kami sampaikan. Terimakasih.\n\nTembusan:\nYth. Bapak Wakil Wali Kota Bandung\nYth. Bapak Sekretaris Daerah Kota Bandung`;
        
        const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
      };

      if (!isFirebaseConfigured) return <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4"><div className="bg-white p-8 rounded-2xl shadow-lg"><h2 className="font-bold text-xl">Konfigurasi Firebase Diperlukan</h2></div></div>;
      if (isLoading) return <div className="min-h-screen flex items-center justify-center bg-slate-50"><Loader2 className="w-10 h-10 animate-spin text-blue-600"/></div>;
      if (!user) return <AuthScreen onLogin={setUser} setGlobalRole={setUserRole} setGlobalProfile={setUserProfile} showToast={showToast} />;

      // Dynamic Sidebar Navigation based on Role
      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: LayoutDashboard },
        ...(userRole === 'admin' ? [{ id: 'fetch_news', label: 'Tarik Berita', icon: Download }] : []),
        { id: 'social', label: 'Media Sosial', icon: Share2 },
        { id: 'online', label: 'Media Online', icon: Globe },
        { id: 'print', label: 'Media Cetak', icon: Newspaper },
        { id: 'analysis', label: 'Analisis Isu', icon: Brain },
      ];

      return (
        <div className="min-h-screen bg-slate-50 flex overflow-hidden font-sans">
          {toast.show && (<div className={`fixed top-4 right-4 z-[9999] px-5 py-2.5 text-sm rounded-xl shadow-2xl flex items-center animate-bounce ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'} text-white`}><span className="font-medium">{toast.message}</span></div>)}
          
          <aside className={`bg-slate-900 text-slate-300 w-56 flex-shrink-0 flex flex-col transition-transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full fixed h-full z-40'}`}>
            <div className="p-5 bg-slate-950 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <Activity className="text-blue-500" size={20}/>
                <div className="flex flex-col">
                  <span className="text-white font-bold text-sm">Media Monitoring</span>
                  <span className="text-slate-400 text-[9px] leading-tight mt-0.5">Pemerintah Kota Bandung</span>
                </div>
              </div>
            </div>
            <nav className="flex-1 py-4 px-3 space-y-1">
              {navItems.map(item => (<button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-colors ${activeTab === item.id ? 'bg-blue-600 text-white shadow-sm' : 'hover:bg-slate-800'}`}><item.icon size={18} /><span className="font-bold text-xs">{item.label}</span></button>))}
            </nav>
            <div className="p-4"><button onClick={handleLogout} className="w-full py-2.5 bg-red-500/10 hover:bg-red-500/20 transition-colors text-red-400 rounded-lg flex justify-center text-xs font-bold"><LogOut size={16} className="mr-2"/> Logout</button></div>
          </aside>

          <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
            <header className="bg-white px-5 py-3 border-b flex justify-between items-center">
              <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-1.5 hover:bg-slate-100 bg-slate-50 border rounded-lg"><Menu size={18}/></button>
              <div className="flex items-center gap-4">
                <span className="hidden sm:inline-block font-bold text-[11px] bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full shadow-sm">{userProfile?.name} ({userRole === 'admin' ? 'Admin' : (userRole === 'pimpinan' ? 'Pimpinan' : userProfile?.agency)})</span>
                
                <div className="relative">
                  <button onClick={() => setShowNotifPanel(!showNotifPanel)} className="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 relative transition-colors">
                    <Bell size={18}/>
                    {notifications.length > 0 && <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border border-white"></span>}
                  </button>
                  
                  {showNotifPanel && (
                    <div className="absolute right-0 mt-3 w-80 bg-white border border-slate-200 shadow-2xl rounded-2xl z-50 overflow-hidden">
                       <div className="p-4 bg-slate-50 border-b flex justify-between items-center">
                         <span className="font-bold text-slate-800 text-sm">Notifikasi Isu Baru</span>
                         <span className="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded-full">{notifications.length} Baru</span>
                       </div>
                       <div className="max-h-72 overflow-y-auto custom-scrollbar">
                         {notifications.length > 0 ? notifications.map(n => (
                           <div key={n.id} onClick={() => { setViewingIssue(n); setShowNotifPanel(false); }} className="p-4 border-b hover:bg-slate-50 cursor-pointer transition-colors">
                             <p className="text-[10px] font-bold text-blue-600 mb-1 line-clamp-1">{(n.leadingSectors || [n.leadingSector]).filter(Boolean).join(', ')}</p>
                             <p className="text-xs font-semibold text-slate-800 line-clamp-2">{n.title}</p>
                             <div className="flex justify-between items-center mt-2">
                               <span className="text-[9px] text-slate-500 bg-slate-200 px-1.5 py-0.5 rounded">{n.sourceType}</span>
                               <span className="text-[9px] text-slate-400">{n.date}</span>
                             </div>
                           </div>
                         )) : <p className="p-6 text-xs text-center text-slate-500">Belum ada isu baru untuk OPD Anda.</p>}
                       </div>
                    </div>
                  )}
                </div>
              </div>
            </header>
            <div className="flex-1 overflow-y-auto p-5 scroll-smooth"><div className="max-w-7xl mx-auto">
              {activeTab === 'dashboard' && <DashboardView issues={issues} setActiveTab={setActiveTab} potensiIsuList={potensiIsuList} role={userRole} onSavePotensiIsu={savePotensiIsu} showToast={showToast} />}
              {activeTab === 'fetch_news' && userRole === 'admin' && <FetchNewsView onFetchNews={handleFetchNews} isFetchingNews={isFetchingNews} fetchedNewsList={fetchedNewsList} onApprove={handleApproveNews} onDiscard={handleDiscardNews} />}
              {activeTab === 'social' && <DataTableView title="Media Sosial" type="Media Sosial" issues={issues.filter(i=>i.sourceType==='Media Sosial')} onAdd={()=>setIsIssueModalOpen('Media Sosial')} onEdit={(i)=>{setEditingIssue(i); setIsIssueModalOpen('Media Sosial');}} onDelete={triggerDeleteIssue} role={userRole} onView={setViewingIssue} />}
              {activeTab === 'online' && <DataTableView title="Media Online" type="Media Online" issues={issues.filter(i=>i.sourceType==='Media Online')} onAdd={()=>setIsIssueModalOpen('Media Online')} onEdit={(i)=>{setEditingIssue(i); setIsIssueModalOpen('Media Online');}} onDelete={triggerDeleteIssue} role={userRole} onView={setViewingIssue} />}
              {activeTab === 'print' && <DataTableView title="Media Cetak" type="Media Cetak" issues={issues.filter(i=>i.sourceType==='Media Cetak')} onAdd={()=>setIsIssueModalOpen('Media Cetak')} onEdit={(i)=>{setEditingIssue(i); setIsIssueModalOpen('Media Cetak');}} onDelete={triggerDeleteIssue} role={userRole} onView={setViewingIssue} />}
              {activeTab === 'analysis' && <AnalysisView issues={issues} role={userRole} agency={userProfile?.agency} onAnalyze={handleAnalyzeAI} analyzingId={analyzingId} onView={setViewingIssue} onPublishToggle={togglePublishAnalysis} onEditAnalysis={setEditingAnalysisIssue} onDelete={triggerDeleteIssue} onDownloadAll={handleDownloadAllWord} onDownloadRecap={handleDownloadRecapWord} />}
            </div></div>
            
            {isIssueModalOpen && <IssueModal type={isIssueModalOpen} onClose={() => {setIsIssueModalOpen(false); setEditingIssue(null);}} onSave={saveIssue} initialData={editingIssue} isUploading={isUploading} showToast={showToast}/>}
            {handlingIssue && <HandlingModal issue={handlingIssue} onClose={() => {setHandlingIssue(null); setViewingIssue(handlingIssue);}} onSave={saveHandlingUpdate} isUploading={isUploading} role={userRole} userAgency={userProfile?.agency} showToast={showToast}/>}
            {editingAnalysisIssue && <AnalysisEditModal issue={editingAnalysisIssue} onClose={() => setEditingAnalysisIssue(null)} onSave={saveAnalysisEdit} isUploading={isUploading}/>}

            {viewingIssue && (
              <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4">
                 <div className="bg-white rounded-2xl w-full max-w-5xl shadow-2xl p-6 overflow-y-auto max-h-[90vh] relative">
                    <button onClick={()=>setViewingIssue(null)} className="absolute top-4 right-4 p-2 bg-slate-100 rounded-full hover:bg-slate-200"><X size={20}/></button>
                    <h2 className="text-2xl font-bold mb-6 pr-10 text-slate-800">{viewingIssue.title}</h2>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                       
                       {/* KOLOM KIRI: Informasi & Konten */}
                       <div className="space-y-4">
                          <div className="bg-blue-50 p-5 rounded-xl border border-blue-100 shadow-sm">
                            <h4 className="font-bold text-blue-800 mb-4 flex items-center text-sm"><Share2 size={16} className="mr-2"/> Informasi Sumber & Sektor</h4>
                            <div className="space-y-3 text-sm text-slate-700">
                               <p><strong>Jenis Media:</strong> {viewingIssue.sourceType}</p>
                               
                               {viewingIssue.sourceType === 'Media Cetak' && viewingIssue.mediaName && (
                                  <p><strong>Nama Media:</strong> {viewingIssue.mediaName}</p>
                               )}

                               {viewingIssue.sourceType === 'Media Sosial' && (
                                  <>
                                     {(viewingIssue.platforms && viewingIssue.platforms.filter(Boolean).length > 0) ? (
                                        <p><strong>Platform:</strong> {viewingIssue.platforms.filter(Boolean).join(', ')}</p>
                                     ) : (viewingIssue.platform && (
                                        <p><strong>Platform:</strong> {viewingIssue.platform}</p>
                                     ))}
                                     
                                     {(viewingIssue.accounts && viewingIssue.accounts.filter(Boolean).length > 0) ? (
                                        <p><strong>Nama Akun:</strong> {viewingIssue.accounts.filter(Boolean).join(', ')}</p>
                                     ) : (viewingIssue.account && (
                                        <p><strong>Nama Akun:</strong> {viewingIssue.account}</p>
                                     ))}
                                  </>
                               )}

                               {viewingIssue.sourceType === 'Media Online' && (
                                  <>
                                     {(viewingIssue.domains && viewingIssue.domains.filter(Boolean).length > 0) ? (
                                        <p><strong>Domain Berita:</strong> {viewingIssue.domains.filter(Boolean).join(', ')}</p>
                                     ) : (viewingIssue.domain && (
                                        <p><strong>Domain Berita:</strong> {viewingIssue.domain}</p>
                                     ))}
                                  </>
                               )}

                               {(viewingIssue.links || [viewingIssue.link]).filter(Boolean).length > 0 && viewingIssue.sourceType !== 'Media Cetak' && (
                                  <div>
                                      <strong>Tautan/Link:</strong>
                                      <ul className="list-disc pl-5 mt-1 text-xs space-y-1">
                                          {(viewingIssue.links || [viewingIssue.link]).filter(Boolean).map((l, i) => (
                                              <li key={i}><a href={l} target="_blank" rel="noreferrer" className="text-blue-600 hover:underline break-all">{l}</a></li>
                                          ))}
                                      </ul>
                                  </div>
                               )}
                               
                               <div>
                                   <strong>Leading Sector:</strong>
                                   <div className="flex flex-wrap gap-1.5 mt-1.5">
                                      {(viewingIssue.leadingSectors || [viewingIssue.leadingSector]).filter(Boolean).map((s, i) => (
                                          <span key={i} className="text-xs bg-white border border-blue-200 text-blue-700 px-2 py-1 rounded font-bold shadow-sm">{s}</span>
                                      ))}
                                   </div>
                               </div>
                               {viewingIssue.attachmentUrl && (
                                  <div className="mt-2 pt-3 border-t border-blue-200">
                                      <a href={viewingIssue.attachmentUrl} target="_blank" rel="noreferrer" className="inline-flex bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg font-bold text-xs shadow-sm"><ImageIcon size={14} className="mr-1.5"/> Lihat Lampiran Isu</a>
                                  </div>
                               )}
                            </div>
                          </div>

                          <div className="bg-slate-50 p-5 rounded-xl border border-slate-100">
                            <p className="text-sm font-bold text-slate-500 mb-2">Isi/Konten</p>
                            <p className="text-sm text-slate-800 whitespace-pre-wrap">{viewingIssue.content || viewingIssue.caption || '-'}</p>
                          </div>
                          
                          {/* Daftar Komentar Netizen untuk Medsos */}
                          {viewingIssue.sourceType === 'Media Sosial' && viewingIssue.comments && viewingIssue.comments.length > 0 && (
                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                              <p className="text-sm font-bold text-slate-500 mb-3">Komentar Netizen</p>
                              <div className="space-y-3 max-h-48 overflow-y-auto custom-scrollbar pr-2">
                                {viewingIssue.comments.map((c, i) => (
                                  <div key={i} className="p-3 bg-white border border-slate-200 rounded-lg shadow-sm">
                                    <div className="flex justify-between items-center mb-1.5">
                                      <span className="text-xs font-bold text-blue-600">@{c.account || 'anonim'}</span>
                                      <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${c.sentiment === 'Positif' ? 'bg-emerald-100 text-emerald-700' : c.sentiment === 'Negatif' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}`}>{c.sentiment}</span>
                                    </div>
                                    <p className="text-sm text-slate-700">{c.content}</p>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}
                          
                          <div className="bg-slate-50 p-5 rounded-xl border border-slate-100">
                            <div className="flex justify-between items-center mb-4">
                               <p className="font-bold text-slate-800 text-sm">Riwayat Penanganan</p>
                               <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${viewingIssue.status === 'Selesai' ? 'bg-emerald-100 text-emerald-700' : viewingIssue.status === 'Dalam Proses' ? 'bg-blue-100 text-blue-700' : 'bg-slate-200 text-slate-700'}`}>{viewingIssue.status || 'Belum Ditangani'}</span>
                            </div>
                            
                            <div className="space-y-4 max-h-60 overflow-y-auto custom-scrollbar pr-2">
                               {viewingIssue.handlingList && viewingIssue.handlingList.length > 0 ? (
                                  viewingIssue.handlingList.map((h, i) => (
                                     <div key={i} className="p-3 bg-white border border-slate-200 rounded-lg shadow-sm relative group">
                                        {userRole === 'admin' && (
                                            <button 
                                                onClick={() => handleDeleteHandlingRecord(viewingIssue.id, i)}
                                                className="absolute top-2 right-2 p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-md transition-colors"
                                                title="Hapus Progress Ini"
                                            >
                                                <Trash2 size={14}/>
                                            </button>
                                        )}
                                        <div className="flex justify-between items-start mb-1 pr-8">
                                           <span className="text-[11px] font-bold text-blue-600">{h.agency}</span>
                                           <span className="text-[10px] text-slate-400">{h.handlingDate}</span>
                                        </div>
                                        <p className="text-[10px] text-slate-500 mb-2">Status: <strong className="text-slate-700">{h.status}</strong> (by: {h.updatedBy})</p>
                                        <p className="text-xs text-slate-700 whitespace-pre-wrap">{h.handlingNotes}</p>
                                        {h.handlingAttachmentUrl && (
                                          <a href={h.handlingAttachmentUrl} target="_blank" rel="noreferrer" className="inline-flex mt-2 bg-emerald-50 text-emerald-600 px-2 py-1 rounded text-[10px] font-bold hover:bg-emerald-100"><ImageIcon size={12} className="mr-1"/> Lihat Bukti</a>
                                        )}
                                     </div>
                                  ))
                               ) : (
                                  // Tampilan Lama / Jika belum pakai sistem Array
                                  viewingIssue.handlingNotes ? (
                                    <div className="p-3 bg-white border border-slate-200 rounded-lg shadow-sm relative group">
                                        <div className="flex justify-between items-start mb-1 pr-8">
                                           <span className="text-[11px] font-bold text-blue-600">Catatan Penanganan (Lama)</span>
                                           <span className="text-[10px] text-slate-400">{viewingIssue.handlingDate}</span>
                                        </div>
                                        <p className="text-xs text-slate-700 whitespace-pre-wrap">{viewingIssue.handlingNotes}</p>
                                        {viewingIssue.handlingAttachmentUrl && (
                                          <a href={viewingIssue.handlingAttachmentUrl} target="_blank" rel="noreferrer" className="inline-flex mt-2 bg-emerald-50 text-emerald-600 px-2 py-1 rounded text-[10px] font-bold hover:bg-emerald-100"><ImageIcon size={12} className="mr-1"/> Lihat Bukti</a>
                                        )}
                                    </div>
                                  ) : (
                                     <p className="text-xs text-slate-400 text-center py-2">Belum ada riwayat progres penanganan instansi.</p>
                                  )
                               )}
                            </div>

                            {(userRole === 'admin' || (viewingIssue.leadingSectors || []).includes(userProfile?.agency)) && (
                              <button onClick={() => {setHandlingIssue(viewingIssue); setViewingIssue(null);}} className="w-full mt-4 bg-emerald-600 text-white py-2.5 rounded-lg font-bold text-sm flex items-center justify-center shadow-md hover:bg-emerald-700 transition-colors"><Plus size={16} className="mr-2"/> Tambah Progress Penanganan</button>
                            )}
                          </div>
                       </div>
                       
                       {/* KOLOM KANAN: Analisis AI */}
                       <div>
                         {viewingIssue.aiAnalysis && (userRole === 'admin' || userRole === 'pimpinan' || (viewingIssue.leadingSectors || [viewingIssue.leadingSector]).includes(userProfile?.agency)) ? (
                            <div className="bg-amber-50 p-6 rounded-xl border border-amber-200 h-full flex flex-col shadow-sm">
                              <div className="flex flex-wrap justify-between items-start mb-5 border-b border-amber-200 pb-4 gap-2">
                                 <h4 className="font-bold text-amber-900 flex items-center text-lg"><Brain className="mr-2 text-amber-600"/> Hasil Analisis & Rekomendasi</h4>
                                 <div className="flex gap-2">
                                     <button onClick={() => handleDownloadWord(viewingIssue)} className="text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1.5 rounded font-bold transition-colors shadow-sm">DOCX</button>
                                     <button onClick={() => handleDownloadPDF(viewingIssue)} className="text-xs bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded font-bold transition-colors shadow-sm">PDF</button>
                                     <button onClick={() => handleSendWA(viewingIssue)} className="text-xs bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded font-bold transition-colors shadow-sm flex items-center" title="Kirim Laporan via WhatsApp"><MessageCircle size={14}/></button>
                                 </div>
                              </div>
                              
                              <div className="flex-1 overflow-y-auto pr-2 space-y-5">
                                <div>
                                   <p className="text-xs text-amber-800/70 uppercase tracking-wider font-bold mb-1.5">Analisis:</p>
                                   <p className="text-sm text-slate-800 whitespace-pre-wrap leading-relaxed">{viewingIssue.aiAnalysis.analysis || "Belum ada teks analisis."}</p>
                                </div>
                                <div>
                                   <p className="text-xs text-amber-800/70 uppercase tracking-wider font-bold mb-1.5">Rekomendasi Kebijakan:</p>
                                   <p className="text-sm text-slate-800 whitespace-pre-wrap leading-relaxed">{viewingIssue.aiAnalysis.policyRecommendation || "-"}</p>
                                </div>
                                <div>
                                   <p className="text-xs text-amber-800/70 uppercase tracking-wider font-bold mb-1.5">Rekomendasi Publikasi:</p>
                                   <p className="text-sm text-slate-800 whitespace-pre-wrap leading-relaxed">{viewingIssue.aiAnalysis.publicationRecommendation || "-"}</p>
                                </div>
                              </div>
                            </div>
                         ) : (
                           <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 text-center text-slate-500 h-full flex flex-col items-center justify-center">
                             <Lock size={32} className="mb-3 text-slate-300"/>
                             {userRole === 'admin' ? "Pilih tombol analisis untuk memproses isu ini." : "Isu ini belum dianalisis atau bukan kewenangan Anda."}
                           </div>
                         )}
                       </div>
                    </div>
                 </div>
              </div>
            )}

            {confirmDialog && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden p-6 text-center">
                  <AlertTriangle size={48} className="mx-auto text-amber-500 mb-4" />
                  <h3 className="text-lg font-bold text-slate-800 mb-2">{confirmDialog.title}</h3>
                  <p className="text-sm text-slate-600 mb-6">{confirmDialog.message}</p>
                  <div className="flex justify-center gap-3">
                    <button onClick={() => setConfirmDialog(null)} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">Batal</button>
                    <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-md transition-colors">Ya, Hapus</button>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
