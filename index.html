  <style>
    html { font-size: 13.5px; }
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

  </style>

</head>
<body class="bg-slate-50">
  
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    
    import { 
      LayoutDashboard, Share2, Globe, Newspaper, BrainCircuit, 
      Menu, X, Search, Plus, Calendar, BarChart2,
      Activity, LogOut, ChevronRight, Upload, CheckCircle2,
      AlertTriangle, Info, Building, FileText,
      Link as LinkIcon, Image as ImageIcon, Loader2, Save, Trash2, Edit2, Eye,
      Bell, MessageCircle, Brain, Download, Send, Lock, Filter, TrendingUp, ChevronLeft
    } from 'https://esm.sh/lucide-react@0.378.0?deps=react@18.3.1';

    import { 
      BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip as RechartsTooltip, 
      ResponsiveContainer, PieChart as RechartsPieChart, Pie, Cell
    } from 'https://esm.sh/recharts@2.12.7?deps=react@18.3.1,react-dom@18.3.1';

    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js';
    import { 
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
      signOut, onAuthStateChanged, sendPasswordResetEmail
    } from 'https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js';
    import { 
      initializeFirestore, doc, setDoc, getDoc, collection, onSnapshot, 
      addDoc, updateDoc, deleteDoc, query, orderBy, where
    } from 'https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBgdRBGLeU47SxYGMlArfLbgPwVHtRpFQ4",
      authDomain: "media-analytics-pemkot-bandung.firebaseapp.com",
      projectId: "media-analytics-pemkot-bandung",
      storageBucket: "media-analytics-pemkot-bandung.firebasestorage.app",
      messagingSenderId: "661324655366",
      appId: "1:661324655366:web:bcd72621003cf1f62e8c87"
    };

    const isFirebaseConfigured = !firebaseConfig.apiKey.includes("MASUKKAN");
    const app = isFirebaseConfigured ? initializeApp(firebaseConfig) : null;
    const auth = app ? getAuth(app) : null;
    const db = app ? initializeFirestore(app, { experimentalForceLongPolling: true }) : null;
    const appId = 'media-analytics-bdg';

    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxfYsICDQuO9zSEXbt3DAa3wLQzQFT0_PJpmYxucObovR48hoIHt6ZVDVdvGC-z-dz2Kw/exec';
    const OPENAI_API_KEY = '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';
    const GNEWS_API_KEY = '094e65d34c1a45eaf46aba2a2bde6269';

    const LEADING_SECTORS = [
      "Inspektorat", "Badan Perencanaan Pembangunan Riset dan Inovasi Daerah", "Badan Kepegawaian dan Pengembangan Sumber Daya Manusia", 
      "Badan Keuangan dan Aset Daerah", "Badan Pendapatan Daerah", "Badan Kesatuan Bangsa dan Politik", "Badan Penanggulangan Bencana Daerah", 
      "Satuan Polisi Pamong Praja", "Dinas Cipta Karya, Bina Konstruksi dan Tata Ruang", "Dinas Pemadam Kebakaran Dan Penyelamatan", 
      "Dinas Kebudayaan dan Pariwisata", "Dinas Kependudukan dan Pencatatan Sipil", "Dinas Kesehatan", "Dinas Ketahanan Pangan dan Pertanian", 
      "Dinas Ketenagakerjaan", "Dinas Komunikasi dan Informatika", "Dinas Koperasi dan Usaha Kecil Dan Menengah", "Dinas Lingkungan Hidup", 
      "Dinas Sumber Daya Air dan Bina Marga", "Dinas Pemberdayaan Perempuan dan Perlindungan Anak", "Dinas Pemuda dan Olah Raga", 
      "Dinas Penanaman Modal dan Pelayanan Terpadu Satu Pintu", "Dinas Pendidikan", "Dinas Pengendalian Penduduk dan Keluarga Berencana", 
      "Dinas Perdagangan dan Perindustrian", "Dinas Perhubungan", "Dinas Perumahan dan Kawasan Permukiman", "Dinas Sosial", 
      "Dinas Arsip dan Perpustakaan", "Bagian Tata Pemerintahan", "Bagian Kesejahteraan Rakyat", "Bagian Kerja Sama", 
      "Bagian Perekonomian", "Bagian Hukum", "Bagian Umum", "Bagian Adminstrasi Pembangunan", "Bagian Pengadaan Barang/Jasa", 
      "Bagian Organisasi", "Bagian Perencanaan, Keuangan dan Kepegawaian", "Bagian Protokol dan Komunikasi Pimpinan", 
      "Rumah Sakit Umum Daerah", "RSUD Bandung Kiwari", "Rumah Sakit Khusus Gigi dan Mulut", 
      "PT BII", "Perumda Tirtawening", "Perumda Pasar", "Bank Bandung", 
      "Kecamatan Cibeunying Kaler", "Kecamatan Cidadap", "Kecamatan Sukajadi", "Kecamatan Cicendo", "Kecamatan Andir", 
      "Kecamatan Coblong", "Kecamatan Bandung Wetan", "Kecamatan Sumur Bandung", "Kecamatan Cibeunying Kidul", "Kecamatan Sukasari", 
      "Kecamatan Astana anyar", "Kecamatan Bojongloa Kaler", "Kecamatan Bojongloa Kidul", "Kecamatan Babakan Ciparay", "Kecamatan Bandung Kulon", 
      "Kecamatan Regol", "Kecamatan Lengkong", "Kecamatan Batununggal", "Kecamatan Kiaracondong", "Kecamatan Arcamanik", "Kecamatan Cibiru", 
      "Kecamatan Rancasari", "Kecamatan Antapani", "Kecamatan Bandung Kidul", "Kecamatan Gedebage", "Kecamatan Panyileukan", "Kecamatan Cinambo", 
      "Kecamatan Mandalajati", "Kecamatan Ujungberung", "Kecamatan Buahbatu", "Lainnya"
    ];

    const ISSUE_CATEGORIES = [
      "Birokrasi", "Pelayanan", "Infrastruktur", "Lingkungan", "Ketertiban", "Keamanan", 
      "Sosial", "Ekonomi", "Budaya", "Pendidikan", "Kesehatan", "Lainnya"
    ];

    const PRINT_MEDIA_NAMES = [
      "Kompas", "Pikiran Rakyat", "Jabar Ekspres", "Inilah Koran", "Tribun Jabar", 
      "Galamedia", "Radar Bandung", "Lainnya"
    ];

    const COLORS = { Positif: '#10b981', Negatif: '#ef4444', Netral: '#f59e0b' };

    const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const YEARS = ['2024', '2025', '2026', '2027', '2028', '2029', '2030'];

    function AuthScreen({ onLogin, setGlobalRole, setGlobalProfile, showToast }) {
      const [isLogin, setIsLogin] = useState(true);
      const [isForgotPassword, setIsForgotPassword] = useState(false);
      const [regRole, setRegRole] = useState('pd'); 
      const [name, setName] = useState('');
      const [agency, setAgency] = useState(LEADING_SECTORS[0]);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [accessCode, setAccessCode] = useState(''); 
      const [loading, setLoading] = useState(false);

      const recordToGoogleSheet = async (userEmail, userRole, userName = '', userAgency = '') => {
        if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("MASUKKAN")) return;
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'recordUser', email: userEmail, role: userRole, name: userName, agency: userAgency })
          });
        } catch (err) { console.error(err); }
      };

      const handleResetPassword = async (e) => {
        e.preventDefault();
        if (!email) return showToast("Masukkan email Anda terlebih dahulu", "error");
        setLoading(true);
        try {
          await sendPasswordResetEmail(auth, email);
          showToast("Tautan reset password telah dikirim ke email Anda", "success");
          setIsForgotPassword(false);
        } catch (error) { showToast(error.message, "error"); } finally { setLoading(false); }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          if (isLogin) {
            await signInWithEmailAndPassword(auth, email, password);
          } else {
            if (regRole === 'admin' && accessCode !== '@prokopim2026') {
              showToast("Kode akses admin salah!", "error"); setLoading(false); return;
            }
            if ((regRole === 'pd' || regRole === 'pimpinan') && accessCode !== 'PROKOPIM2026') {
              showToast("Kode akses salah!", "error"); setLoading(false); return;
            }
            if ((regRole === 'pd' || regRole === 'pimpinan') && !name) {
              showToast("Nama lengkap harus diisi!", "error"); setLoading(false); return;
            }

            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            const profileData = {
              email: userCred.user.email, role: regRole,
              name: regRole === 'admin' ? 'Admin Prokopim' : name,
              agency: regRole === 'pd' ? agency : (regRole === 'pimpinan' ? 'Pimpinan Daerah' : 'Sekretariat Daerah'),
              createdAt: new Date().toISOString()
            };
            
            await setDoc(doc(db, 'artifacts', appId, 'users', userCred.user.uid, 'profile', 'info'), profileData);
            await recordToGoogleSheet(email, regRole, profileData.name, profileData.agency);
            
            setGlobalRole(regRole);
            setGlobalProfile(profileData);
            showToast("Registrasi berhasil", "success");
          }
        } catch (error) {
          let msg = error.message;
          if (error.code === 'auth/email-already-in-use') { msg = 'Email sudah terdaftar. Silakan pindah ke menu Login.'; setIsLogin(true); }
          else if (error.code === 'auth/invalid-credential') msg = 'Email atau password salah.';
          showToast(msg, "error");
        } finally { setLoading(false); }
      };

      return (
        <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 relative overflow-hidden">
          <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
          <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>

          <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md relative z-10 border border-slate-100">
            <div className="text-center mb-8">
              <div className="w-16 h-16 bg-gradient-to-tr from-blue-600 to-emerald-400 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg shadow-blue-500/30 transform rotate-3">
                <LayoutDashboard className="text-white w-8 h-8 -rotate-3" />
              </div>
              <h2 className="text-2xl font-bold text-slate-800">Media Monitoring</h2>
              <p className="text-slate-500 text-sm mt-1">Pemerintah Kota Bandung</p>
            </div>

            {isForgotPassword ? (
              <form onSubmit={handleResetPassword} className="space-y-4">
                <h3 className="text-lg font-bold text-center text-slate-800 mb-2">Reset Password</h3>
                <p className="text-sm text-center text-slate-500 mb-4">Masukkan email Anda untuk mereset password.</p>
                <div><input type="email" required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500" value={email} onChange={e => setEmail(e.target.value)} placeholder="Email Anda"/></div>
                <button type="submit" disabled={loading} className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg flex justify-center">{loading ? <Loader2 className="animate-spin" /> : 'Kirim Link Reset'}</button>
                <div className="mt-4 text-center text-sm"><button type="button" onClick={() => setIsForgotPassword(false)} className="font-bold text-slate-600">Kembali ke Login</button></div>
              </form>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-4">
                {!isLogin && (
                  <div className="flex bg-slate-100 p-1 rounded-xl mb-4 gap-1">
                    <button type="button" onClick={() => setRegRole('pd')} className={`flex-1 py-2 text-[11px] sm:text-xs font-bold rounded-lg transition-all ${regRole === 'pd' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>Perangkat Daerah</button>
                    <button type="button" onClick={() => setRegRole('pimpinan')} className={`flex-1 py-2 text-[11px] sm:text-xs font-bold rounded-lg transition-all ${regRole === 'pimpinan' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>Pimpinan</button>
                    <button type="button" onClick={() => setRegRole('admin')} className={`flex-1 py-2 text-[11px] sm:text-xs font-bold rounded-lg transition-all ${regRole === 'admin' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>Admin</button>
                  </div>
                )}

                {!isLogin && (regRole === 'pd' || regRole === 'pimpinan') && (
                  <div><input type="text" required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500" value={name} onChange={e => setName(e.target.value)} placeholder="Nama Lengkap" /></div>
                )}
                {!isLogin && regRole === 'pd' && (
                  <div>
                    <select required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500 bg-white" value={agency} onChange={e => setAgency(e.target.value)}>
                      {LEADING_SECTORS.map(sec => <option key={sec} value={sec}>{sec}</option>)}
                    </select>
                  </div>
                )}

                <div><input type="email" required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500" value={email} onChange={e => setEmail(e.target.value)} placeholder="email@bandung.go.id" /></div>
                <div><input type="password" required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500" value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" /></div>
                
                {!isLogin && (
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 mt-2">
                    <label className="block text-xs font-bold text-slate-700 mb-1">Kode Akses</label>
                    <input type="password" required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-emerald-500" value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Masukkan Kode Akses" />
                  </div>
                )}

                {isLogin && (<div className="flex justify-end"><button type="button" onClick={() => setIsForgotPassword(true)} className="text-sm font-medium text-blue-600 hover:underline">Lupa Password?</button></div>)}

                <button type="submit" disabled={loading} className="w-full py-3.5 mt-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg flex justify-center">{loading ? <Loader2 className="animate-spin" /> : (isLogin ? 'Login' : 'Registrasi')}</button>
              </form>
            )}

            {!isForgotPassword && (
              <div className="mt-6 text-center text-sm text-slate-600">
                {isLogin ? "Belum punya akun? " : "Sudah punya akun? "}
                <button type="button" onClick={() => setIsLogin(!isLogin)} className="font-bold text-blue-600 hover:underline">{isLogin ? 'Registrasi' : 'Login'}</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function DashboardView({ issues, setActiveTab, potensiIsuList, role, onSavePotensiIsu, showToast }) {
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');

      const [isEditingPotensi, setIsEditingPotensi] = useState(false);
      const [selectedPotensiId, setSelectedPotensiId] = useState('');
      const [editDataPotensi, setEditDataPotensi] = useState({ id: '', month: '', year: '', points: [''] });
      const [confirmDialog, setConfirmDialog] = useState(null);

      const currentPotensi = useMemo(() => {
          if (!potensiIsuList || potensiIsuList.length === 0) return null;
          return potensiIsuList.find(m => m.id === selectedPotensiId) || potensiIsuList[0];
      }, [potensiIsuList, selectedPotensiId]);

      useEffect(() => { 
          if (currentPotensi && currentPotensi.id !== selectedPotensiId) {
              setSelectedPotensiId(currentPotensi.id); 
          }
      }, [currentPotensi, selectedPotensiId]);

      const handleAddPotensi = () => {
          setEditDataPotensi({ id: Date.now().toString(), month: MONTHS[new Date().getMonth()], year: new Date().getFullYear().toString(), points: [''] });
          setIsEditingPotensi(true);
      };

      const handleEditPotensi = () => {
          if(currentPotensi) { setEditDataPotensi(JSON.parse(JSON.stringify(currentPotensi))); setIsEditingPotensi(true); }
      };

      const handleDeletePotensi = () => {
          if(!currentPotensi) return;
          setConfirmDialog({
              title: "Hapus Isu Prioritas",
              message: "Yakin ingin menghapus daftar ini?",
              onConfirm: () => {
                  const newArr = potensiIsuList.filter(m => m.id !== currentPotensi.id);
                  onSavePotensiIsu(newArr);
                  setSelectedPotensiId('');
              }
          });
      };

      const handleSavePotensi = () => {
          const cleanPoints = editDataPotensi.points.filter(p => p.trim() !== '');
          if(cleanPoints.length === 0) {
             showToast("Minimal masukkan 1 poin daftar", "error");
             return;
          }
          const finalData = { ...editDataPotensi, points: cleanPoints };
          const newArr = [...(potensiIsuList || [])];
          const existingIdx = newArr.findIndex(m => m.id === finalData.id);
          if(existingIdx >= 0) newArr[existingIdx] = finalData; else newArr.unshift(finalData);
          onSavePotensiIsu(newArr);
          setSelectedPotensiId(finalData.id); setIsEditingPotensi(false);
      };

      const filteredIssues = useMemo(() => {
        return issues.filter(issue => {
          if (!issue.date) return true;
          if (startDate && issue.date < startDate) return false;
          if (endDate && issue.date > endDate) return false;
          return true;
        });
      }, [issues, startDate, endDate]);

      const stats = useMemo(() => {
        const total = filteredIssues.length;
        const social = filteredIssues.filter(i => i.sourceType === 'Media Sosial').length;
        const online = filteredIssues.filter(i => i.sourceType === 'Media Online').length;
        const print = filteredIssues.filter(i => i.sourceType === 'Media Cetak').length;
        
        const sentimentData = [
          { name: 'Positif', value: filteredIssues.filter(i => i.sentiment === 'Positif').length, color: COLORS.Positif },
          { name: 'Negatif', value: filteredIssues.filter(i => i.sentiment === 'Negatif').length, color: COLORS.Negatif },
          { name: 'Netral', value: filteredIssues.filter(i => i.sentiment === 'Netral').length, color: COLORS.Netral },
        ];

        const statusCount = { 'Belum Ditangani': 0, 'Dalam Proses': 0, 'Selesai': 0 };
        const sectorCount = {};
        const categoryIssueCount = {};
        
        filteredIssues.forEach(i => {
          const status = i.status || 'Belum Ditangani';
          if (statusCount[status] !== undefined) statusCount[status]++;
          else statusCount['Belum Ditangani']++;
          
          const sectors = i.leadingSectors || (i.leadingSector ? [i.leadingSector] : ['Lainnya']);
          sectors.forEach(sector => {
            sectorCount[sector] = (sectorCount[sector] || 0) + 1;
          });

          const categories = i.issueCategories || (i.issueCategory ? [i.issueCategory] : ['Belum Dikategorikan']);
          categories.forEach(cat => {
            categoryIssueCount[cat] = (categoryIssueCount[cat] || 0) + 1;
          });
        });

        const statusData = [
          { name: 'Belum', value: statusCount['Belum Ditangani'], color: '#94a3b8' },
          { name: 'Proses', value: statusCount['Dalam Proses'], color: '#3b82f6' },
          { name: 'Selesai', value: statusCount['Selesai'], color: '#10b981' }
        ];

        const sectorData = Object.keys(sectorCount).map(k => ({ name: k, total: sectorCount[k] })).sort((a, b) => b.total - a.total);
        const categoryIssueData = Object.keys(categoryIssueCount).map(k => ({ name: k, total: categoryIssueCount[k] })).sort((a,b) => b.total - a.total);

        return { total, social, online, print, sentimentData, statusData, sectorData, categoryIssueData };
      }, [filteredIssues]);

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between bg-white p-5 rounded-2xl shadow-sm border border-slate-100 gap-4">
             <h2 className="font-bold text-slate-800 text-lg flex items-center"><Activity className="mr-2 text-blue-600"/> Ringkasan Dashboard</h2>
             <div className="flex items-center gap-3">
                <div className="flex items-center gap-2">
                   <span className="text-xs font-bold text-slate-500">Mulai:</span>
                   <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="border border-slate-200 bg-slate-50 rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div className="flex items-center gap-2">
                   <span className="text-xs font-bold text-slate-500">Sampai:</span>
                   <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="border border-slate-200 bg-slate-50 rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
             </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div onClick={() => setActiveTab('social')} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center cursor-pointer hover:shadow-md hover:border-blue-200 transition-all group">
              <div className="w-14 h-14 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mr-4 group-hover:scale-110 transition-transform"><Share2 size={24} /></div>
              <div><p className="text-slate-500 text-sm font-medium">Media Sosial</p><p className="text-2xl font-bold text-slate-800">{stats.social}</p></div>
            </div>
            <div onClick={() => setActiveTab('online')} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center cursor-pointer hover:shadow-md hover:border-blue-200 transition-all group">

              <div><p className="text-slate-500 text-sm font-medium">Media Online</p><p className="text-2xl font-bold text-slate-800">{stats.online}</p></div>
            </div>
            <div onClick={() => setActiveTab('print')} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center cursor-pointer hover:shadow-md hover:border-blue-200 transition-all group">
              <div className="w-14 h-14 bg-pink-50 text-pink-600 rounded-xl flex items-center justify-center mr-4 group-hover:scale-110 transition-transform"><Newspaper size={24} /></div>
              <div><p className="text-slate-500 text-sm font-medium">Media Cetak</p><p className="text-2xl font-bold text-slate-800">{stats.print}</p></div>

            <div onClick={() => setActiveTab('dashboard')} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center">
              <div className="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center mr-4"><Activity size={24} /></div>
              <div><p className="text-slate-500 text-sm font-medium">Total Isu</p><p className="text-2xl font-bold text-slate-800">{stats.total}</p></div>

          </div>

              <div className="flex flex-wrap justify-between items-center mb-4 pb-3 border-b border-slate-100 gap-2">
                  <h3 className="font-bold text-slate-800 flex items-center text-sm"><TrendingUp className="mr-2 text-amber-500" size={16} /> Daftar Isu Prioritas (Potensi Isu)</h3>
                  <div className="flex items-center gap-1.5">
                      <select value={selectedPotensiId} onChange={(e) => setSelectedPotensiId(e.target.value)} className="bg-slate-50 border border-slate-200 text-xs rounded-lg px-2 py-1.5 outline-none font-bold text-slate-600">
                          {(potensiIsuList || []).map(m => <option key={m.id} value={m.id}>{m.month} {m.year}</option>)}

                      </select>
                      {role === 'admin' && !isEditingPotensi && (
                          <>
                              {currentPotensi && (
                                  <>
                                      <button onClick={handleEditPotensi} className="p-1.5 text-amber-600 hover:bg-amber-50 rounded-lg transition-colors" title="Edit Riwayat Ini"><Edit2 size={14}/></button>
                                      <button onClick={handleDeletePotensi} className="p-1.5 text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Hapus Riwayat Ini"><Trash2 size={14}/></button>

              {isEditingPotensi ? (
                  <div className="flex flex-col">
                      <div className="flex gap-2 mb-2">
                          <select value={editDataPotensi.month} onChange={e => setEditDataPotensi({...editDataPotensi, month: e.target.value})} className="border border-slate-200 bg-white rounded-lg px-2 py-1.5 text-xs outline-none flex-1 font-bold text-slate-600">{MONTHS.map(m=><option key={m} value={m}>{m}</option>)}</select>
                          <select value={editDataPotensi.year} onChange={e => setEditDataPotensi({...editDataPotensi, year: e.target.value})} className="border border-slate-200 bg-white rounded-lg px-2 py-1.5 text-xs outline-none flex-1 font-bold text-slate-600">{YEARS.map(y=><option key={y} value={y}>{y}</option>)}</select>
                      </div>
                      <div className="space-y-3 max-h-48 overflow-y-auto custom-scrollbar pr-2 mt-2 bg-slate-50 p-4 rounded-xl border border-slate-200">

                              <div key={idx} className="flex gap-2 items-start">

                                        const newPts = [...editDataPotensi.points]; newPts[idx] = e.target.value; setEditDataPotensi({...editDataPotensi, points: newPts});

                                 />

                              </div>

                      <div className="flex justify-end gap-2 mt-4 pt-4 border-t border-slate-100">

              <div className="h-64">
                {stats.categoryIssueData.length > 0 ? (
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={stats.categoryIssueData} margin={{ top: 5, right: 20, left: -20, bottom: 40 }}>
                      <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                      <XAxis dataKey="name" tick={{fontSize: 10, fill: '#64748b'}} interval={0} angle={-30} textAnchor="end" />
                      <YAxis allowDecimals={false} tick={{fontSize: 11, fill: '#64748b'}} axisLine={false} tickLine={false} />
                      <RechartsTooltip cursor={{fill: '#f8fafc'}} contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} />
                      <Bar dataKey="total" fill="#8b5cf6" radius={[4, 4, 0, 0]} barSize={35} />
                    </BarChart>
                  </ResponsiveContainer>

              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
              <h3 className="font-bold text-slate-800 mb-4 flex items-center text-sm"><CheckCircle2 className="mr-2 text-slate-400" size={16}/> Status Penanganan</h3>
              <div className="h-48 flex-1">
                <ResponsiveContainer width="100%" height="100%">
                  <RechartsPieChart>
                    <Pie data={stats.statusData} cx="50%" cy="50%" innerRadius={50} outerRadius={70} paddingAngle={5} dataKey="value">
                      {stats.statusData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} />)}
                    </Pie>
                    <RechartsTooltip contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} />
                  </RechartsPieChart>
                </ResponsiveContainer>
              </div>
              <div className="flex justify-center gap-3 mt-4 flex-wrap">
                {stats.statusData.map(item => (<div key={item.name} className="flex items-center text-xs"><span className="w-3 h-3 rounded-full mr-1.5" style={{ backgroundColor: item.color }}></span>{item.name} ({item.value})</div>))}
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[400px]">
              <h3 className="font-bold text-slate-800 mb-4 flex items-center"><Building className="mr-2 text-slate-400" size={18}/> Rekap Perangkat Daerah</h3>
              <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-3">
                {stats.sectorData.map(sector => (
                   <div key={sector.name} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100 hover:bg-blue-50 transition-colors">
                      <span className="text-sm font-semibold text-slate-700 truncate mr-2" title={sector.name}>{sector.name}</span>
                      <span className="bg-blue-100 text-blue-700 font-bold text-xs px-2.5 py-1 rounded-full shrink-0">{sector.total} Isu</span>
                   </div>
                ))}
                {stats.sectorData.length === 0 && <p className="text-sm text-slate-500 text-center py-4">Belum ada data</p>}
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[400px]">
              <h3 className="font-bold text-slate-800 mb-4 flex items-center"><Activity className="mr-2 text-slate-400" size={18} /> Komposisi Sentimen</h3>
              <div className="flex-1 min-h-0">
                <ResponsiveContainer width="100%" height="100%">
                  <RechartsPieChart>
                    <Pie data={stats.sentimentData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value">
                      {stats.sentimentData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} />)}
                    </Pie>
                    <RechartsTooltip />
                  </RechartsPieChart>
                </ResponsiveContainer>
              </div>
              <div className="flex justify-center gap-4 mt-4 shrink-0">
                {stats.sentimentData.map(item => (
                  <div key={item.name} className="flex items-center text-sm"><span className="w-3 h-3 rounded-full mr-2" style={{ backgroundColor: item.color }}></span>{item.name} ({item.value})</div>
                ))}
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[400px]">
              <h3 className="font-bold text-slate-800 mb-4 flex items-center"><Calendar className="mr-2 text-slate-400" size={18} /> Isu Terbaru</h3>
              <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-4">
                {[...filteredIssues].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0)).slice(0, 5).map(issue => (
                  <div key={issue.id} className="p-4 bg-slate-50 rounded-xl border border-slate-100 hover:shadow-sm transition-shadow">
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-[10px] font-bold text-slate-500 bg-white px-2 py-1 rounded border border-slate-200">{issue.sourceType}</span>
                      <span className="text-[10px] text-slate-400">{issue.date}</span>
                    </div>
                    <h4 className="font-bold text-slate-800 text-sm line-clamp-2">{issue.title}</h4>
                    <div className="mt-2 flex flex-wrap gap-2">
                       <span className="text-[10px] text-blue-600 bg-blue-50 px-2 py-1 rounded-md font-medium">{(issue.leadingSectors || [issue.leadingSector]).filter(Boolean).join(', ')}</span>
                       <span className={`text-[10px] px-2 py-1 rounded-md font-medium ${issue.sentiment === 'Positif' ? 'bg-emerald-100 text-emerald-700' : issue.sentiment === 'Negatif' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}`}>{issue.sentiment}</span>
                    </div>
                  </div>
                ))}
                {filteredIssues.length === 0 && <p className="text-center text-slate-500 text-sm py-4">Belum ada isu terdaftar.</p>}
              </div>
            </div>
          </div>

          {confirmDialog && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden p-6 text-center">
                <AlertTriangle size={48} className="mx-auto text-amber-500 mb-4" />
                <h3 className="text-lg font-bold text-slate-800 mb-2">{confirmDialog.title}</h3>
                <p className="text-sm text-slate-600 mb-6">{confirmDialog.message}</p>
                <div className="flex justify-center gap-3">
                  <button onClick={() => setConfirmDialog(null)} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">Batal</button>
                  <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-md transition-colors">Ya, Hapus</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function FetchNewsView({ onFetchNews, isFetchingNews, fetchedNewsList = [], onApprove, onDiscard }) {
      const [keyword, setKeyword] = useState('Pemkot Bandung');
      const [fromDate, setFromDate] = useState('');
      const [toDate, setToDate] = useState('');

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
          <div className="mb-6 flex flex-col md:flex-row md:justify-between md:items-end gap-4 border-b border-slate-100 pb-6">
            <div>
              <h2 className="text-xl font-bold text-slate-800 flex items-center">
                <Download className="mr-2 text-blue-600" /> Tarik Berita Otomatis
              </h2>
              <p className="text-sm text-slate-500 mt-1">Cari dan simpan berita dari Google News secara otomatis untuk dikumpulkan ke Draft.</p>
            </div>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
             <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Kata Kunci (Keyword)</label>
                <input type="text" value={keyword} onChange={e => setKeyword(e.target.value)} className="w-full px-4 py-2 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="Cth: Pemkot Bandung" />
             </div>
             <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Dari Tanggal</label>
                <input type="date" value={fromDate} onChange={e => setFromDate(e.target.value)} className="w-full px-4 py-2 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />
             </div>
             <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Sampai Tanggal</label>
                <input type="date" value={toDate} onChange={e => setToDate(e.target.value)} className="w-full px-4 py-2 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />
             </div>
          </div>

          <button onClick={() => onFetchNews(keyword, fromDate, toDate)} disabled={isFetchingNews || !keyword} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl text-sm font-bold shadow-md flex items-center justify-center transition-all disabled:opacity-50">
             {isFetchingNews ? <Loader2 size={18} className="animate-spin mr-2" /> : <Download size={18} className="mr-2" />}
             {isFetchingNews ? 'Sedang Menarik Berita...' : 'Mulai Tarik Berita'}
          </button>

          {fetchedNewsList && fetchedNewsList.length > 0 ? (
            <div className="mt-8 border-t border-slate-100 pt-6">
              <div className="flex justify-between items-center mb-4">
                 <h3 className="font-bold text-slate-800">Hasil Tarikan Belum Disimpan (Draft) ({fetchedNewsList.length})</h3>
                 <button onClick={() => onDiscard(null, true)} className="text-xs text-red-600 hover:bg-red-50 px-3 py-1.5 rounded-lg font-bold transition-colors">Hapus Semua</button>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                 {fetchedNewsList.map(news => (
                    <div key={news.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col relative">
                       <div className="flex justify-between items-start mb-2">
                          <span className="text-[10px] font-bold bg-blue-50 text-blue-600 px-2 py-1 rounded border border-blue-100">{news.domain}</span>
                          <span className="text-[10px] text-slate-400">{news.date}</span>
                       </div>
                       <h4 className="font-bold text-slate-800 text-sm mb-2 line-clamp-2" title={news.title}>{news.title}</h4>
                       <p className="text-xs text-slate-600 mb-4 line-clamp-3 flex-1">{news.content}</p>
                       <div className="flex gap-2 mt-auto pt-3 border-t border-slate-100">
                          <button onClick={() => onApprove(news)} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold py-2 rounded-lg transition-colors flex items-center justify-center shadow-sm">
                             <Save size={14} className="mr-1.5"/> Simpan ke Sistem
                          </button>
                          <button onClick={() => onDiscard(news.id)} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-red-600 rounded-lg transition-colors" title="Hapus Berita Ini">
                             <Trash2 size={14}/>
                          </button>
                       </div>
                    </div>
                 ))}
              </div>
            </div>
          ) : (
            <div className="mt-6 bg-blue-50 p-4 rounded-xl border border-blue-100 flex items-start gap-3">
               <Info className="text-blue-600 shrink-0 mt-0.5" size={18}/>
               <div className="text-sm text-blue-800">
                  <p className="font-bold mb-1">Catatan Penggunaan:</p>
                  <ul className="list-disc pl-4 space-y-1">
                     <li>Fitur ini akan menarik maksimal 10 berita terbaru berdasarkan kata kunci dan rentang tanggal yang dipilih.</li>
                     <li>Berita yang ditarik akan <strong>muncul di sini terlebih dahulu sebagai Draft</strong>. Anda dapat meninjau dan memilih berita mana yang akan disimpan ke sistem (Media Online).</li>
                     <li>Sistem otomatis mengabaikan berita dengan judul yang sama dengan yang sudah ada di sistem.</li>
                  </ul>
               </div>
            </div>
          )}
        </div>
      );
    }

    function DataTableView({ title, type, issues, onAdd, onEdit, onDelete, role, onView }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [filterDateStart, setFilterDateStart] = useState('');
      const [filterDateEnd, setFilterDateEnd] = useState('');
      const [filterSector, setFilterSector] = useState('');
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 10;

      const filteredIssues = issues.filter(issue => {
        let matches = true;
        
        // Filter Date Range
        if (issue.date) {
            if (filterDateStart && issue.date < filterDateStart) matches = false;
            if (filterDateEnd && issue.date > filterDateEnd) matches = false;
        } else if (filterDateStart || filterDateEnd) {
            matches = false; // Jika filter aktif tapi isu tidak ada tanggal
        }
        
        const sectors = issue.leadingSectors || (issue.leadingSector ? [issue.leadingSector] : []);
        if (filterSector && !sectors.includes(filterSector)) matches = false;
        
        if (searchTerm && !issue.title.toLowerCase().includes(searchTerm.toLowerCase())) matches = false;
        return matches;
      });

      const sortedIssues = [...filteredIssues].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
      
      const totalPages = Math.ceil(sortedIssues.length / itemsPerPage) || 1;
      const startIndex = (currentPage - 1) * itemsPerPage;
      const currentItems = sortedIssues.slice(startIndex, startIndex + itemsPerPage);

      useEffect(() => {
          setCurrentPage(1); // Reset page on filter change
      }, [searchTerm, filterDateStart, filterDateEnd, filterSector]);

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col h-full">
          <div className="p-6 border-b border-slate-100 bg-white flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 sticky top-0 z-10">
            <div>
              <h2 className="text-xl font-bold text-slate-800">{title}</h2>
              <p className="text-sm text-slate-500 mt-1">Total {sortedIssues.length} data ditemukan</p>
            </div>
            <div className="flex flex-col xl:flex-row w-full xl:w-auto items-start xl:items-center gap-3">
              <div className="flex flex-col sm:flex-row w-full gap-2 items-center">
                <div className="flex items-center gap-1.5 w-full sm:w-auto">
                    <span className="text-xs font-bold text-slate-500 hidden md:block">Tgl:</span>
                    <input type="date" value={filterDateStart} onChange={(e) => setFilterDateStart(e.target.value)} className="px-2 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none text-xs w-full sm:w-auto cursor-pointer focus:ring-2 focus:ring-blue-500" title="Dari Tanggal" />
                    <span className="text-xs text-slate-400">-</span>
                    <input type="date" value={filterDateEnd} onChange={(e) => setFilterDateEnd(e.target.value)} className="px-2 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none text-xs w-full sm:w-auto cursor-pointer focus:ring-2 focus:ring-blue-500" title="Sampai Tanggal" />
                </div>
                <select value={filterSector} onChange={(e) => setFilterSector(e.target.value)} className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm w-full sm:max-w-[180px] truncate cursor-pointer bg-white">
                  <option value="">Semua OPD</option>
                  {LEADING_SECTORS.map(sec => <option key={sec} value={sec}>{sec}</option>)}
                </select>
                <div className="relative w-full sm:w-48">
                  <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={16} />
                  <input type="text" placeholder="Cari isu..." className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                </div>
              </div>
              {role === 'admin' && (
                <button onClick={onAdd} className="w-full xl:w-auto bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow flex items-center justify-center shrink-0"><Plus size={16} className="mr-1.5" /> Tambah Data</button>
              )}
            </div>
          </div>

          <div className="overflow-x-auto p-4 flex-1">
            <table className="w-full text-left text-sm whitespace-nowrap">
              <thead className="bg-slate-50 text-slate-600">
                <tr>
                  <th className="p-4 font-bold rounded-tl-lg w-24">Tanggal</th>
                  <th className="p-4 font-bold min-w-[200px]">Judul Isu</th>
                  <th className="p-4 font-bold min-w-[150px]">Leading Sector</th>
                  <th className="p-4 font-bold text-center w-24">Sentimen</th>
                  <th className="p-4 font-bold text-center w-32">Status</th>
                  <th className="p-4 font-bold text-right rounded-tr-lg w-24">Aksi</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {currentItems.map((issue) => (
                  <tr key={issue.id} className="hover:bg-slate-50 transition-colors group">
                    <td className="p-4 text-slate-600">{issue.date}</td>
                    <td className="p-4 font-medium text-slate-800 max-w-[300px] truncate" title={issue.title}>{issue.title}</td>
                    <td className="p-4 text-slate-600 max-w-[200px] truncate" title={(issue.leadingSectors || [issue.leadingSector]).filter(Boolean).join(', ')}>
                        {(issue.leadingSectors || [issue.leadingSector]).filter(Boolean).join(', ')}
                    </td>
                    <td className="p-4 text-center">
                       <span className={`inline-flex px-2.5 py-1 rounded-full text-[11px] font-bold ${issue.sentiment === 'Positif' ? 'bg-emerald-100 text-emerald-700' : issue.sentiment === 'Negatif' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}`}>{issue.sentiment}</span>
                    </td>
                    <td className="p-4 text-center">
                      <span className={`inline-flex px-2.5 py-1 rounded-full text-[11px] font-bold ${issue.status === 'Selesai' ? 'bg-emerald-100 text-emerald-700' : issue.status === 'Dalam Proses' ? 'bg-blue-100 text-blue-700' : 'bg-slate-200 text-slate-700'}`}>{issue.status || 'Belum Ditangani'}</span>
                    </td>
                    <td className="p-4 text-right opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity flex justify-end">
                      <button onClick={() => onView(issue)} className="p-2 text-slate-400 hover:text-blue-600 rounded-lg mr-1"><Eye size={16} /></button>
                      {role === 'admin' && (
                        <>
                          <button onClick={() => onEdit(issue)} className="p-2 text-slate-400 hover:text-amber-600 rounded-lg mr-1"><Edit2 size={16} /></button>
                          <button onClick={() => onDelete(issue.id)} className="p-2 text-slate-400 hover:text-red-600 rounded-lg"><Trash2 size={16} /></button>
                        </>
                      )}
                    </td>
                  </tr>
                ))}
                {currentItems.length === 0 && (<tr><td colSpan="6" className="p-8 text-center text-slate-500">Tidak ada data.</td></tr>)}
              </tbody>
            </table>
          </div>

          {/* Pagination Controls */}
          {totalPages > 1 && (
              <div className="p-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between">
                  <span className="text-xs text-slate-500">Halaman {currentPage} dari {totalPages}</span>
                  <div className="flex gap-1">
                      <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1} className="p-1.5 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-100 disabled:opacity-50 transition-colors"><ChevronLeft size={16}/></button>
                      
                      {/* Tampilkan nomor halaman (batas maks 5 tombol agar tidak panjang) */}
                      {Array.from({length: Math.min(5, totalPages)}, (_, i) => {
                          let pageNum = i + 1;
                          if (totalPages > 5 && currentPage > 3) {
                              pageNum = currentPage - 2 + i;
                              if (pageNum > totalPages) pageNum = totalPages - (4 - i);
                          }
                          return (
                              <button key={pageNum} onClick={() => setCurrentPage(pageNum)} className={`w-8 h-8 rounded-lg text-xs font-bold transition-colors border ${currentPage === pageNum ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'}`}>
                                  {pageNum}
                              </button>
                          )
                      })}
                      
                      <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages} className="p-1.5 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-100 disabled:opacity-50 transition-colors"><ChevronRight size={16}/></button>
                  </div>
              </div>
          )}
        </div>
      );
    }

    function AnalysisView({ issues, role, agency, onAnalyze, analyzingId, onView, onPublishToggle, onEditAnalysis, onDelete, onDownloadAll, onDownloadRecap }) {
      const [filterPeriod, setFilterPeriod] = useState('all');
      const [filterDate, setFilterDate] = useState('');
      const [filterMedia, setFilterMedia] = useState('');

      const issuesForAnalysis = issues.filter(issue => {
        if (role !== 'admin' && role !== 'pimpinan' && !issue.analysisPublished) return false;
        if (filterDate && issue.date !== filterDate) return false;
        if (filterMedia && issue.sourceType !== filterMedia) return false;
        
        if (filterPeriod !== 'all' && issue.date) {
            const issueDate = new Date(issue.date);
            const now = new Date();
            if (filterPeriod === 'today') {
                if (issueDate.toDateString() !== now.toDateString()) return false;
            } else if (filterPeriod === 'week') {
                const diffTime = Math.abs(now - issueDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays > 7) return false;
            } else if (filterPeriod === 'month') {
                if (issueDate.getMonth() !== now.getMonth() || issueDate.getFullYear() !== now.getFullYear()) return false;
            }
        }

        if (role === 'admin' || role === 'pimpinan') return true;
        const sectors = issue.leadingSectors || (issue.leadingSector ? [issue.leadingSector] : []);
        return sectors.includes(agency) && issue.aiAnalysis;
      });

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
          <div className="mb-6 flex flex-col md:flex-row md:justify-between md:items-end gap-4 border-b border-slate-100 pb-6">
            <div>
              <h2 className="text-xl font-bold text-slate-800 flex items-center">
                <Brain className="mr-2 text-blue-600" /> Analisis Isu
              </h2>
            </div>
            <div className="flex flex-wrap gap-3 items-end">
              {role === 'admin' && (
                <div className="flex gap-2">
                  <button onClick={() => onDownloadRecap(issuesForAnalysis)} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm flex items-center transition-colors h-[38px]">
                    <FileText size={16} className="mr-2"/> Rekap Data
                  </button>
                  <button onClick={() => onDownloadAll(issuesForAnalysis)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm flex items-center transition-colors h-[38px]">
                    <Download size={16} className="mr-2"/> Semua Analisis
                  </button>
                </div>
              )}
              <div className="flex flex-col">
                <label className="text-[10px] font-bold text-slate-500 mb-1">Periode Waktu</label>
                <select className="border px-3 py-1.5 rounded-lg text-sm outline-none bg-white h-[38px]" value={filterPeriod} onChange={(e)=>setFilterPeriod(e.target.value)}>
                  <option value="all">Semua Waktu</option><option value="today">Hari Ini</option><option value="week">1 Minggu Terakhir</option><option value="month">Bulan Ini</option>
                </select>
              </div>
              <div className="flex flex-col">
                <label className="text-[10px] font-bold text-slate-500 mb-1">Filter Media</label>
                <select className="border px-3 py-1.5 rounded-lg text-sm outline-none bg-white h-[38px]" value={filterMedia} onChange={(e)=>setFilterMedia(e.target.value)}>
                  <option value="">Semua Media</option><option value="Media Sosial">Media Sosial</option><option value="Media Online">Media Online</option><option value="Media Cetak">Media Cetak</option>
                </select>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {issuesForAnalysis.map(issue => {
              const isThisAnalyzing = analyzingId === issue.id;
              const isAnyAnalyzing = analyzingId !== null;

              return (
                <div key={issue.id} className="bg-white border border-slate-200 rounded-xl p-5 hover:shadow-md transition-shadow flex flex-col relative overflow-hidden">
                  {!issue.analysisPublished && role === 'admin' && <div className="absolute top-0 right-0 bg-amber-100 text-amber-700 text-[10px] font-bold px-3 py-1 rounded-bl-lg">DRAFT</div>}
                  {issue.analysisPublished && role === 'admin' && <div className="absolute top-0 right-0 bg-emerald-100 text-emerald-700 text-[10px] font-bold px-3 py-1 rounded-bl-lg">PUBLISHED</div>}
                  
                  <div className="flex justify-between items-center mb-3 mt-2">
                    <div className="flex gap-2">
                      <span className="text-[10px] font-bold px-2 py-1 bg-white border border-slate-200 rounded text-slate-600">{issue.sourceType}</span>
                      <span className={`text-[10px] font-bold px-2 py-1 rounded ${issue.sentiment === 'Positif' ? 'bg-emerald-100 text-emerald-700' : issue.sentiment === 'Negatif' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}`}>{issue.sentiment}</span>
                    </div>
                    <span className="text-[10px] text-slate-400 font-medium">{issue.date}</span>
                  </div>
                  
                  <h3 className="font-bold text-slate-800 text-sm mb-2 line-clamp-2">{issue.title}</h3>
                  <p className="text-xs text-blue-600 font-medium mb-4 flex-1">{(issue.leadingSectors || [issue.leadingSector]).filter(Boolean).join(', ')}</p>
                  
                  <div className="mt-auto space-y-2">
                    {issue.aiAnalysis ? (
                      <>
                        <div className="flex gap-2">
                          <button onClick={() => onView(issue)} className="flex-1 py-2 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg text-xs font-bold flex justify-center items-center transition-colors">
                            <Eye size={14} className="mr-1.5"/> Lihat Detail
                          </button>
                          {role === 'admin' && (
                            <>
                              <button onClick={() => onEditAnalysis(issue)} className="px-3 py-2 bg-amber-50 text-amber-600 hover:bg-amber-100 rounded-lg transition-colors" title="Edit Manual Analisis">
                                  <Edit2 size={14}/>
                              </button>
                              <button onClick={() => onAnalyze(issue)} disabled={isAnyAnalyzing} className="px-3 py-2 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg transition-colors" title="Analisis Ulang Isu">
                                  {isThisAnalyzing ? <Loader2 size={14} className="animate-spin"/> : <Brain size={14}/>}
                              </button>
                              <button onClick={() => onDelete(issue.id)} className="px-3 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg transition-colors" title="Hapus Isu">
                                  <Trash2 size={14}/>
                              </button>
                            </>
                          )}
                        </div>
                        {role === 'admin' && (
                          <button onClick={() => onPublishToggle(issue.id, issue.analysisPublished)} 
                            className={`w-full py-2.5 rounded-lg text-xs font-bold flex justify-center items-center transition-colors mt-1 ${issue.analysisPublished ? 'bg-slate-100 text-slate-600 hover:bg-slate-200' : 'bg-emerald-600 text-white hover:bg-emerald-700'}`}>
                            {issue.analysisPublished ? 'Unpublish' : <><Send size={14} className="mr-1.5"/> Publish</>}
                          </button>
                        )}
                      </>
                    ) : (
                      role === 'admin' && (
                        <div className="flex gap-2">
                          <button onClick={() => onAnalyze(issue)} disabled={isAnyAnalyzing} 
                            className="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold shadow-sm transition-all flex items-center justify-center disabled:opacity-50">
                            {isThisAnalyzing ? <Loader2 size={14} className="animate-spin mr-2"/> : <Brain size={14} className="mr-2"/>}
                            {isThisAnalyzing ? 'Menganalisis...' : 'Analisis AI'}
                          </button>
                          <button onClick={() => onDelete(issue.id)} className="px-3 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg transition-colors" title="Hapus Isu">
                              <Trash2 size={14}/>
                          </button>
                        </div>
                      )
                    )}
                  </div>
                </div>
              );
            })}
            {issuesForAnalysis.length === 0 && (
              <div className="col-span-full py-12 text-center">
                 <Brain className="mx-auto h-12 w-12 text-slate-300 mb-3"/>
                 <p className="text-slate-500">Tidak ada isu yang tersedia untuk ditampilkan.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function IssueModal({ type, onClose, onSave, initialData, isUploading, showToast }) {
      const [formData, setFormData] = useState(() => {
        const defaultData = initialData || {
          sourceType: type,
          title: '', date: new Date().toISOString().split('T')[0],
          sentiment: 'Netral', leadingSector: LEADING_SECTORS[0],
          issueCategory: 'Birokrasi',
          platform: '', postType: '', account: '', link: '', caption: '',
          domain: '', content: '',
          printType: 'Koran', mediaName: PRINT_MEDIA_NAMES[0], customMediaName: '', comments: []
        };
        
        let defaultPostType = defaultData.postType || 'Post Foto/Video/Teks';
        if (['Komentar', 'Ulasan', 'Post Foto/Video'].includes(defaultPostType)) {
            defaultPostType = 'Post Foto/Video/Teks';
        }

        const initialCat = defaultData.issueCategory || 'Birokrasi';
        const isCustomCat = !ISSUE_CATEGORIES.includes(initialCat) && initialCat !== 'Lainnya';

        const initialMedia = defaultData.mediaName || PRINT_MEDIA_NAMES[0];
        const isCustomMedia = !PRINT_MEDIA_NAMES.includes(initialMedia) && initialMedia !== 'Lainnya';

        return {
          ...defaultData,
          leadingSectors: defaultData.leadingSectors || (defaultData.leadingSector ? [defaultData.leadingSector] : [LEADING_SECTORS[0]]),
          issueCategories: defaultData.issueCategories || (defaultData.issueCategory ? [defaultData.issueCategory] : [ISSUE_CATEGORIES[0]]),
          mediaName: isCustomMedia ? 'Lainnya' : initialMedia,
          customMediaName: isCustomMedia ? initialMedia : '',
          links: defaultData.links || (defaultData.link ? [defaultData.link] : ['']),
          domains: defaultData.domains || (defaultData.domain ? [defaultData.domain] : ['']),
          platforms: defaultData.platforms || (defaultData.platform ? [defaultData.platform] : ['Instagram']),
          accounts: defaultData.accounts || (defaultData.account ? [defaultData.account] : ['']),
          postType: defaultPostType,
          comments: defaultData.comments || []
        };
      });
      
      const [file, setFile] = useState(null);

      const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

      const handleArrayChange = (field, index, value) => {
          const newArr = [...(formData[field] || [])];
          newArr[index] = value;
          setFormData({ ...formData, [field]: newArr });
      };
      
      const addArrayItem = (field, defaultVal) => {
          setFormData({ ...formData, [field]: [...(formData[field] || []), defaultVal] });
      };
      
      const removeArrayItem = (field, index) => {
          const newArr = (formData[field] || []).filter((_, i) => i !== index);
          setFormData({ ...formData, [field]: newArr });
      };

      const handleCommentChange = (index, field, value) => {
          const newComments = [...(formData.comments || [])];
          if (!newComments[index]) newComments[index] = { sentiment: 'Netral', account: '', content: '' };
          newComments[index][field] = value;
          setFormData({ ...formData, comments: newComments });
      };
      
      const addCommentItem = () => {
          setFormData({ ...formData, comments: [...(formData.comments || []), { sentiment: 'Netral', account: '', content: '' }] });
      };
      
      const removeCommentItem = (index) => {
          const newComments = (formData.comments || []).filter((_, i) => i !== index);
          setFormData({ ...formData, comments: newComments });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const finalCategory = formData.issueCategory === 'Lainnya' ? formData.customIssueCategory : formData.issueCategory;
        const dataToSave = { ...formData, issueCategory: finalCategory };
        if (type === 'Media Cetak') {
            dataToSave.mediaName = formData.mediaName === 'Lainnya' ? formData.customMediaName : formData.mediaName;
            delete dataToSave.customMediaName;
            delete dataToSave.links;
        }
        delete dataToSave.customIssueCategory;
        onSave(dataToSave, file);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div className="bg-slate-50 px-6 py-4 flex justify-between items-center border-b border-slate-100">
              <h3 className="text-xl font-bold text-slate-800">{initialData ? 'Edit Data' : 'Tambah Data'} {type}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X size={24} /></button>
            </div>
            
            <form onSubmit={handleSubmit} className="p-6 overflow-y-auto custom-scrollbar space-y-5">
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm font-medium text-slate-700 mb-1">Tanggal</label><input type="date" name="date" required value={formData.date} onChange={handleChange} className="w-full px-3 py-2 border rounded-xl outline-none" /></div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">
                    {type === 'Media Sosial' ? 'Sentimen Postingan' : 'Sentimen'}
                  </label>
                  <select name="sentiment" value={formData.sentiment} onChange={handleChange} className="w-full px-3 py-2 border rounded-xl outline-none bg-white">
                    <option value="Positif">Positif</option><option value="Netral">Netral</option><option value="Negatif">Negatif</option>
                  </select>
                </div>
              </div>
              
              <div><label className="block text-sm font-medium text-slate-700 mb-1">Judul Isu</label><input type="text" name="title" required value={formData.title} onChange={handleChange} className="w-full px-3 py-2 border rounded-xl outline-none" /></div>
              
              <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <div className="flex justify-between items-center mb-3">
                      <label className="text-xs font-bold text-slate-700">Kategori Isu (Bisa Lebih Dari Satu)</label>
                      <button type="button" onClick={() => addArrayItem('issueCategories', ISSUE_CATEGORIES[0])} className="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200 transition-colors">+ Tambah Kategori</button>
                  </div>
                  {(formData.issueCategories || []).map((cat, i) => (
                      <div key={i} className="flex gap-2 mb-2">
                          <div className="flex-1 flex flex-col gap-2">
                              <select value={ISSUE_CATEGORIES.includes(cat) ? cat : 'Lainnya'} onChange={(e) => {
                                  const val = e.target.value;
                                  handleArrayChange('issueCategories', i, val === 'Lainnya' ? '' : val);
                              }} className="w-full px-3 py-2 text-sm border rounded-xl outline-none bg-white">
                                  {ISSUE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                              </select>
                              {!ISSUE_CATEGORIES.includes(cat) && (
                                  <input type="text" value={cat} onChange={(e) => handleArrayChange('issueCategories', i, e.target.value)} placeholder="Tuliskan kategori..." className="w-full px-3 py-2 text-sm border rounded-xl outline-none" required />
                              )}
                          </div>
                          {(formData.issueCategories || []).length > 1 && (
                              <button type="button" onClick={() => removeArrayItem('issueCategories', i)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors h-[38px]" title="Hapus"><X size={16}/></button>
                          )}
                      </div>
                  ))}
              </div>

              <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <div className="flex justify-between items-center mb-3">
                      <label className="text-xs font-bold text-slate-700">Leading Sector (Bisa Lebih Dari Satu)</label>
                      <button type="button" onClick={() => addArrayItem('leadingSectors', LEADING_SECTORS[0])} className="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200 transition-colors">+ Tambah OPD</button>
                  </div>
                  {(formData.leadingSectors || [formData.leadingSector || LEADING_SECTORS[0]]).map((sec, i) => (
                      <div key={i} className="flex gap-2 mb-2">
                          <select value={sec} onChange={(e) => handleArrayChange('leadingSectors', i, e.target.value)} className="w-full px-3 py-2 text-sm border rounded-xl outline-none bg-white">
                              {LEADING_SECTORS.map(op => <option key={op} value={op}>{op}</option>)}
                          </select>
                          {(formData.leadingSectors || []).length > 1 && (
                              <button type="button" onClick={() => removeArrayItem('leadingSectors', i)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors" title="Hapus"><X size={16}/></button>
                          )}
                      </div>
                  ))}
              </div>

              {type === 'Media Sosial' && (
                 <>
                   <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                       <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                           <div className="flex justify-between items-center mb-3">
                               <label className="text-xs font-bold text-slate-700">Platform</label>
                               <button type="button" onClick={() => addArrayItem('platforms', 'Instagram')} className="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200 transition-colors">+ Tambah</button>
                           </div>
                           {(formData.platforms || [formData.platform || 'Instagram']).map((plat, i) => (
                               <div key={i} className="flex gap-2 mb-2">
                                   <select value={plat} onChange={(e) => handleArrayChange('platforms', i, e.target.value)} className="w-full px-3 py-2 text-sm border rounded-xl outline-none bg-white">
                                       <option value="Instagram">Instagram</option>
                                       <option value="Twitter/X">Twitter/X</option>
                                       <option value="TikTok">TikTok</option>
                                       <option value="Facebook">Facebook</option>
                                       <option value="YouTube">YouTube</option>
                                       <option value="Threads">Threads</option>
                                   </select>
                                   {(formData.platforms || []).length > 1 && (
                                       <button type="button" onClick={() => removeArrayItem('platforms', i)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg"><X size={16}/></button>
                                   )}
                               </div>
                           ))}
                       </div>
                       
                       <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                           <div className="flex justify-between items-center mb-3">
                               <label className="text-xs font-bold text-slate-700">Akun (Username)</label>
                               <button type="button" onClick={() => addArrayItem('accounts', '')} className="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200 transition-colors">+ Tambah</button>
                           </div>
                           {(formData.accounts || [formData.account || '']).map((acc, i) => (
                               <div key={i} className="flex gap-2 mb-2">
                                   <input type="text" value={acc} onChange={(e) => handleArrayChange('accounts', i, e.target.value)} className="w-full px-3 py-2 text-sm border rounded-xl outline-none" placeholder="@username" />
                                   {(formData.accounts || []).length > 1 && (
                                       <button type="button" onClick={() => removeArrayItem('accounts', i)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg"><X size={16}/></button>
                                   )}
                               </div>
                           ))}
                       </div>
                   </div>

                   <div>
                     <label className="block text-sm font-medium text-slate-700 mb-1">Jenis Interaksi</label>
                     <select name="postType" value={formData.postType} onChange={handleChange} className="w-full px-3 py-2 border rounded-xl bg-white outline-none">
                       <option value="Direct Message (DM)">Direct Message (DM)</option>
                       <option value="Post Foto/Video/Teks">Post Foto/Video/Teks</option>
                     </select>
                   </div>
                   
                   <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                      <div className="flex justify-between items-center mb-3">
                          <label className="text-xs font-bold text-slate-700">Link URL</label>

                       <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">

                              <button type="button" onClick={() => addArrayItem('links', '')} className="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200">+ Tambah Link</button>
                          </div>
                          {(formData.links || [formData.link || '']).map((link, i) => (
                              <div key={i} className="flex gap-2 mb-2">
                                  <input type="url" value={link} onChange={(e) => handleArrayChange('links', i, e.target.value)} className="w-full px-3 py-2 text-sm border rounded-xl outline-none" placeholder="https://..." />
                                  {(formData.links || []).length > 1 && (
                                      <button type="button" onClick={() => removeArrayItem('links', i)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg"><X size={16}/></button>

                   <div><label className="block text-sm font-medium text-slate-700 mb-1">Isi Berita</label><textarea name="content" rows="4" value={formData.content} onChange={handleChange} className="w-full px-3 py-2 border rounded-xl outline-none"></textarea></div>

              {type === 'Media Cetak' && (
                 <>
                   <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                     <div><label className="block text-sm font-medium text-slate-700 mb-1">Jenis Media</label><select name="printType" value={formData.printType} onChange={handleChange} className="w-full px-3 py-2 border rounded-xl bg-white"><option value="Koran">Koran</option><option value="Majalah">Majalah</option></select></div>

                            <input type="text" name="customMediaName" value={formData.customMediaName} onChange={handleChange} placeholder="Tuliskan nama media..." className="w-full px-3 py-2 text-sm border rounded-xl outline-none" required />

              <div className="p-4 bg-blue-50/50 rounded-xl border border-blue-100 border-dashed">

                    const selectedFile = e.target.files[0];
                    if (selectedFile) {
                        const maxSize = 3 * 1024 * 1024; // 3MB
                        if (selectedFile.size > maxSize) {
                            if (showToast) showToast("Ukuran file maksimal adalah 3MB", "error");
                            e.target.value = null;
                            setFile(null);

                        }

              <div className="pt-4 border-t flex justify-end gap-3 sticky bottom-0 bg-white">

                  {isUploading ? <Loader2 size={18} className="animate-spin mr-2"/> : <Save size={18} className="mr-2" />} Simpan
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

               </div>
               
               <div className="p-4 bg-emerald-50/50 rounded-xl border border-emerald-100 border-dashed">
                <label className="block text-sm font-bold text-slate-700 mb-2 flex flex-col">
                  <div className="flex items-center">
                    <Upload size={16} className="mr-2 text-emerald-600"/> Upload Bukti Penanganan
                  </div>
                  <span className="text-[10px] text-slate-500 font-normal mt-1">Mendukung Gambar, Video, PDF, dan Word. Maksimal 3MB.</span>
                </label>
                <input 
                  type="file" 
                  accept="image/*,video/*,.pdf,.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" 
                  onChange={(e) => {
                    const selectedFile = e.target.files[0];
                    if (selectedFile) {
                        const maxSize = 3 * 1024 * 1024; // 3MB
                        if (selectedFile.size > maxSize) {
                            if (showToast) showToast("Ukuran file maksimal adalah 3MB", "error");
                            e.target.value = null;
                            setFile(null);
                        } else {
                            setFile(selectedFile);

                    }
                  }} 
                  className="text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:bg-emerald-100 file:text-emerald-700"

              </div>
              
              <div className="pt-4 flex justify-end gap-3 border-t border-slate-100 mt-2">
                <button onClick={onClose} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl font-bold">Batal</button>
                <button onClick={() => onSave(status, notes, file, handlingDate, agency)} disabled={isUploading || !notes} className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl flex items-center disabled:opacity-50" title={!notes ? 'Catatan wajib diisi' : ''}>
                   {isUploading ? <Loader2 size={18} className="animate-spin mr-2"/> : <CheckCircle2 size={18} className="mr-2"/>} Simpan Progres
