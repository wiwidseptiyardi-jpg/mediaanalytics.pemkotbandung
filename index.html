<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Monitoring - Pemkot Bandung</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- html2pdf Library untuk Export Laporan ke PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    /* CSS Tambahan untuk Kerapian */
    html { font-size: 13.5px; }
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>

  <!-- Babel Standalone untuk menjalankan React (JSX) di Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
  
  <div id="root"></div>

  <!-- Script Utama -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    
    import { 
      LayoutDashboard, Share2, Globe, Newspaper, BrainCircuit, 
      Menu, X, Search, Plus, Calendar, BarChart2,
      Activity, LogOut, ChevronRight, Upload, CheckCircle2,
      AlertTriangle, Info, Building, FileText,
      Link as LinkIcon, Image as ImageIcon, Loader2, Save, Trash2, Edit2, Eye,
      Bell, MessageCircle, Brain, Download, Send, Lock, Filter
    } from 'https://esm.sh/lucide-react@0.378.0?deps=react@18.3.1';

    import { 
      BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip as RechartsTooltip, 
      ResponsiveContainer, PieChart as RechartsPieChart, Pie, Cell
    } from 'https://esm.sh/recharts@2.12.7?deps=react@18.3.1,react-dom@18.3.1';

    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js';
    import { 
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
      signOut, onAuthStateChanged, sendPasswordResetEmail
    } from 'https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js';
    import { 
      getFirestore, doc, setDoc, getDoc, collection, onSnapshot, 
      addDoc, updateDoc, deleteDoc, query, orderBy
    } from 'https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js';
    import { 
      getStorage, ref, uploadBytesResumable, getDownloadURL 
    } from 'https://www.gstatic.com/firebasejs/10.5.0/firebase-storage.js';

    // 1. KONFIGURASI FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyBgdRBGLeU47SxYGMlArfLbgPwVHtRpFQ4",
      authDomain: "media-analytics-pemkot-bandung.firebaseapp.com",
      projectId: "media-analytics-pemkot-bandung",
      storageBucket: "media-analytics-pemkot-bandung.firebasestorage.app",
      messagingSenderId: "661324655366",
      appId: "1:661324655366:web:bcd72621003cf1f62e8c87"
    };

    const isFirebaseConfigured = !firebaseConfig.apiKey.includes("MASUKKAN");
    const app = isFirebaseConfigured ? initializeApp(firebaseConfig) : null;
    const auth = app ? getAuth(app) : null;
    const db = app ? getFirestore(app) : null;
    const storage = app ? getStorage(app) : null;
    const appId = 'media-analytics-bdg';

    // 2. URL WEB APP GOOGLE SCRIPT
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzzklnJMSsLK5BxOkYWXaLHNLKY6VEmMj2uMROVtXwqpfVOZeXquVs_S1fK9UGMqPU1Mg/exec';

    // 3. API KEY GNEWS
    const GNEWS_API_KEY = '094e65d34c1a45eaf46aba2a2bde6269';

    const LEADING_SECTORS = [
      "Inspektorat", "Badan Perencanaan Pembangunan Riset dan Inovasi Daerah", "Badan Kepegawaian dan Pengembangan Sumber Daya Manusia", 
      "Badan Keuangan dan Aset Daerah", "Badan Pendapatan Daerah", "Badan Kesatuan Bangsa dan Politik", "Badan Penanggulangan Bencana Daerah", 
      "Satuan Polisi Pamong Praja", "Dinas Cipta Karya, Bina Konstruksi dan Tata Ruang", "Dinas Pemadam Kebakaran Dan Penyelamatan", 
      "Dinas Kebudayaan dan Pariwisata", "Dinas Kependudukan dan Pencatatan Sipil", "Dinas Kesehatan", "Dinas Ketahanan Pangan dan Pertanian", 
      "Dinas Ketenagakerjaan", "Dinas Komunikasi dan Informatika", "Dinas Koperasi dan Usaha Kecil Dan Menengah", "Dinas Lingkungan Hidup", 
      "Dinas Sumber Daya Air dan Bina Marga", "Dinas Pemberdayaan Perempuan dan Perlindungan Anak", "Dinas Pemuda dan Olah Raga", 
      "Dinas Penanaman Modal dan Pelayanan Terpadu Satu Pintu", "Dinas Pendidikan", "Dinas Pengendalian Penduduk dan Keluarga Berencana", 
      "Dinas Perdagangan dan Perindustrian", "Dinas Perhubungan", "Dinas Perumahan dan Kawasan Permukiman", "Dinas Sosial", 
      "Dinas Arsip dan Perpustakaan", "Bagian Tata Pemerintahan", "Bagian Kesejahteraan Rakyat", "Bagian Kerja Sama", 
      "Bagian Perekonomian", "Bagian Hukum", "Bagian Umum", "Bagian Administrasi Pembangunan", "Bagian Pengadaan Barang/Jasa", 
      "Bagian Organisasi", "Bagian Perencanaan, Keuangan dan Kepegawaian", "Bagian Protokol dan Komunikasi Pimpinan", 
      "Rumah Sakit Umum Daerah", "RSUD Bandung Kiwari", "Rumah Sakit Khusus Gigi dan Mulut", 
      "PT BII", "Perumda Tirtawening", "Perumda Pasar", "Bank Bandung", 
      "Kecamatan Cibeunying Kaler", "Kecamatan Cidadap", "Kecamatan Sukajadi", "Kecamatan Cicendo", "Kecamatan Andir", 
      "Kecamatan Coblong", "Kecamatan Bandung Wetan", "Kecamatan Sumur Bandung", "Kecamatan Cibeunying Kidul", "Kecamatan Sukasari", 
      "Kecamatan Astana anyar", "Kecamatan Bojongloa Kaler", "Kecamatan Bojongloa Kidul", "Kecamatan Babakan Ciparay", "Kecamatan Bandung Kulon", 
      "Kecamatan Regol", "Kecamatan Lengkong", "Kecamatan Batununggal", "Kecamatan Kiaracondong", "Kecamatan Arcamanik", "Kecamatan Cibiru", 
      "Kecamatan Rancasari", "Kecamatan Antapani", "Kecamatan Bandung Kidul", "Kecamatan Gedebage", "Kecamatan Panyileukan", "Kecamatan Cinambo", 
      "Kecamatan Mandalajati", "Kecamatan Ujungberung", "Kecamatan Buahbatu", "Lainnya"
    ];

    const ISSUE_CATEGORIES = [
      "Birokrasi", "Infrastruktur", "Lingkungan", "Ketertiban", "Keamanan", 
      "Sosial", "Ekonomi", "Budaya", "Pendidikan", "Kesehatan", "Lainnya"
    ];

    const COLORS = {
      Positif: '#10b981',
      Negatif: '#ef4444',
      Netral: '#f59e0b'
    };

    function AuthScreen({ onLogin, setGlobalRole, setGlobalProfile, showToast }) {
      const [isLogin, setIsLogin] = useState(true);
      const [isForgotPassword, setIsForgotPassword] = useState(false);
      const [regRole, setRegRole] = useState('pd'); 
      const [name, setName] = useState('');
      const [agency, setAgency] = useState(LEADING_SECTORS[0]);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [adminCode, setAdminCode] = useState('');
      const [loading, setLoading] = useState(false);

      const recordToGoogleSheet = async (userEmail, userRole, userName = '', userAgency = '') => {
        if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("MASUKKAN_URL")) return;
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'recordUser', email: userEmail, role: userRole, name: userName, agency: userAgency })
          });
        } catch (err) {
          console.error("Gagal mencatat ke Google Sheet:", err);
        }
      };

      const handleResetPassword = async (e) => {
        e.preventDefault();
        if (!email) return showToast("Masukkan email Anda terlebih dahulu", "error");
        setLoading(true);
        try {
          await sendPasswordResetEmail(auth, email);
          showToast("Tautan reset password telah dikirim ke email Anda", "success");
          setIsForgotPassword(false);
        } catch (error) {
          showToast(error.message, "error");
        } finally {
          setLoading(false);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          if (isLogin) {
            await signInWithEmailAndPassword(auth, email, password);
          } else {
            if (regRole === 'admin' && adminCode !== 'PROKOPIM2026') {
              showToast("Kode admin salah!", "error"); setLoading(false); return;
            }
            if ((regRole === 'pd' || regRole === 'pimpinan') && !name) {
              showToast("Nama lengkap harus diisi!", "error"); setLoading(false); return;
            }

            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            const userDocRef = doc(db, 'artifacts', appId, 'users', userCred.user.uid, 'profile', 'info');
            
            const profileData = {
              email: userCred.user.email,
              role: regRole,
              name: regRole === 'admin' ? 'Admin Prokopim' : name,
              agency: regRole === 'pd' ? agency : (regRole === 'pimpinan' ? 'Pimpinan Daerah' : 'Sekretariat Daerah'),
              createdAt: new Date().toISOString()
            };

            await setDoc(userDocRef, profileData);
            await recordToGoogleSheet(email, regRole, profileData.name, profileData.agency);
            
            setGlobalRole(regRole);
            setGlobalProfile(profileData);
            showToast("Registrasi berhasil", "success");
          }
        } catch (error) {
          let msg = error.message;
          if (error.code === 'auth/email-already-in-use') {
            msg = 'Email sudah terdaftar. Mengalihkan ke Login...';
            setIsLogin(true);
          } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
            msg = 'Email atau password salah, atau akun belum terdaftar.';
          }
          showToast(msg, "error");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 relative overflow-hidden">
          <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-500/20 rounded-full blur-3xl"></div>
          <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl"></div>

          <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md relative z-10 border border-slate-100">
            <div className="text-center mb-8">
              <div className="w-16 h-16 bg-gradient-to-tr from-blue-600 to-emerald-400 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <LayoutDashboard className="text-white w-8 h-8" />
              </div>
              <h2 className="text-2xl font-bold text-slate-800">Media Monitoring</h2>
              <p className="text-slate-500 text-sm mt-1">Pemerintah Kota Bandung</p>
            </div>

            {isForgotPassword ? (
              <form onSubmit={handleResetPassword} className="space-y-4">
                <h3 className="text-lg font-bold text-center text-slate-800 mb-2">Reset Password</h3>
                <p className="text-sm text-center text-slate-500 mb-4">Masukkan email Anda untuk mereset password.</p>
                <div>
                  <input type="email" required className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none"
                    value={email} onChange={e => setEmail(e.target.value)} placeholder="Email Anda"/>
                </div>
                <button type="submit" disabled={loading} className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg flex justify-center">
                  {loading ? <Loader2 className="animate-spin" /> : 'Kirim Link Reset'}
                </button>
                <div className="mt-4 text-center text-sm"><button type="button" onClick={() => setIsForgotPassword(false)} className="font-bold text-slate-600">Kembali ke Login</button></div>
              </form>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-4">
                {!isLogin && (
                  <div className="flex bg-slate-100 p-1 rounded-xl mb-4 gap-1">
                    <button type="button" onClick={() => setRegRole('pd')} className={`flex-1 py-2 text-[11px] sm:text-xs font-bold rounded-lg transition-all ${regRole === 'pd' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>Perangkat Daerah</button>
                    <button type="button" onClick={() => setRegRole('pimpinan')} className={`flex-1 py-2 text-[11px] sm:text-xs font-bold rounded-lg transition-all ${regRole === 'pimpinan' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>Pimpinan</button>
                    <button type="button" onClick={() => setRegRole('admin')} className={`flex-1 py-2 text-[11px] sm:text-xs font-bold rounded-lg transition-all ${regRole === 'admin' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>Admin</button>
                  </div>
                )}

                {!isLogin && (regRole === 'pd' || regRole === 'pimpinan') && (
                  <div><input type="text" required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500" value={name} onChange={e => setName(e.target.value)} placeholder="Nama Lengkap" /></div>
                )}
                {!isLogin && regRole === 'pd' && (
                  <div>
                    <select required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500 bg-white" value={agency} onChange={e => setAgency(e.target.value)}>
                      {LEADING_SECTORS.map(sec => <option key={sec} value={sec}>{sec}</option>)}
                    </select>
                  </div>
                )}

                <div><input type="email" required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500" value={email} onChange={e => setEmail(e.target.value)} placeholder="email@bandung.go.id" /></div>
                <div><input type="password" required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500" value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" /></div>
                
                {!isLogin && regRole === 'admin' && (
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 mt-2">
                    <label className="block text-xs font-bold text-slate-700 mb-1">Kode Admin</label>
                    <input type="password" required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-emerald-500" value={adminCode} onChange={e => setAdminCode(e.target.value)} placeholder="Kode Akses" />
                  </div>
                )}

                {isLogin && (<div className="flex justify-end"><button type="button" onClick={() => setIsForgotPassword(true)} className="text-sm font-medium text-blue-600 hover:underline">Lupa Password?</button></div>)}

                <button type="submit" disabled={loading} className="w-full py-3.5 mt-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg flex justify-center">{loading ? <Loader2 className="animate-spin" /> : (isLogin ? 'Login' : 'Registrasi')}</button>
              </form>
            )}

            {!isForgotPassword && (
              <div className="mt-6 text-center text-sm text-slate-600">
                {isLogin ? "Belum punya akun? " : "Sudah punya akun? "}
                <button type="button" onClick={() => setIsLogin(!isLogin)} className="font-bold text-blue-600 hover:underline">{isLogin ? 'Registrasi' : 'Login'}</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function DashboardView({ issues, setActiveTab }) {
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');

      const filteredIssues = useMemo(() => {
        return issues.filter(issue => {
          if (!issue.date) return true;
          if (startDate && issue.date < startDate) return false;
          if (endDate && issue.date > endDate) return false;
          return true;
        });
      }, [issues, startDate, endDate]);

      const stats = useMemo(() => {
        const total = filteredIssues.length;
        const social = filteredIssues.filter(i => i.sourceType === 'Media Sosial').length;
        const online = filteredIssues.filter(i => i.sourceType === 'Media Online').length;
        const print = filteredIssues.filter(i => i.sourceType === 'Media Cetak').length;
        
        const sentimentData = [
          { name: 'Positif', value: filteredIssues.filter(i => i.sentiment === 'Positif').length, color: COLORS.Positif },
          { name: 'Negatif', value: filteredIssues.filter(i => i.sentiment === 'Negatif').length, color: COLORS.Negatif },
          { name: 'Netral', value: filteredIssues.filter(i => i.sentiment === 'Netral').length, color: COLORS.Netral },
        ];

        const statusCount = { 'Belum Ditangani': 0, 'Dalam Proses': 0, 'Selesai': 0 };
        const sectorCount = {};
        const categoryIssueCount = {};
        
        filteredIssues.forEach(i => {
          const status = i.status || 'Belum Ditangani';
          if (statusCount[status] !== undefined) statusCount[status]++;
          else statusCount['Belum Ditangani']++;
          
          const sectors = i.leadingSectors || (i.leadingSector ? [i.leadingSector] : ['Lainnya']);
          sectors.forEach(sector => {
            sectorCount[sector] = (sectorCount[sector] || 0) + 1;
          });

          const cat = i.issueCategory || 'Belum Dikategorikan';
          categoryIssueCount[cat] = (categoryIssueCount[cat] || 0) + 1;
        });

        const statusData = [
          { name: 'Belum', value: statusCount['Belum Ditangani'], color: '#94a3b8' },
          { name: 'Proses', value: statusCount['Dalam Proses'], color: '#3b82f6' },
          { name: 'Selesai', value: statusCount['Selesai'], color: '#10b981' }
        ];

        const sectorData = Object.keys(sectorCount).map(k => ({ name: k, total: sectorCount[k] })).sort((a, b) => b.total - a.total);
        const categoryIssueData = Object.keys(categoryIssueCount).map(k => ({ name: k, total: categoryIssueCount[k] })).sort((a,b) => b.total - a.total);

        return { total, social, online, print, sentimentData, statusData, sectorData, categoryIssueData };
      }, [filteredIssues]);

      return (
        <div className="space-y-6">
          {/* Filter Tanggal Dashboard */}
          <div className="flex flex-wrap items-center justify-between bg-white p-5 rounded-2xl shadow-sm border border-slate-100 gap-4">
             <h2 className="font-bold text-slate-800 text-lg flex items-center"><Activity className="mr-2 text-blue-600"/> Ringkasan Dashboard</h2>
             <div className="flex items-center gap-3">
                <div className="flex items-center gap-2">
                   <span className="text-xs font-bold text-slate-500">Mulai:</span>
                   <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="border border-slate-200 bg-slate-50 rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div className="flex items-center gap-2">
                   <span className="text-xs font-bold text-slate-500">Sampai:</span>
                   <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="border border-slate-200 bg-slate-50 rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
             </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div onClick={() => setActiveTab('social')} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center cursor-pointer hover:shadow-md hover:border-blue-200 transition-all group">
              <div className="w-14 h-14 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mr-4 group-hover:scale-110 transition-transform"><Share2 size={24} /></div>
              <div><p className="text-slate-500 text-sm font-medium">Media Sosial</p><p className="text-2xl font-bold text-slate-800">{stats.social}</p></div>
            </div>
            <div onClick={() => setActiveTab('online')} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center cursor-pointer hover:shadow-md hover:border-blue-200 transition-all group">
              <div className="w-14 h-14 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center mr-4 group-hover:scale-110 transition-transform"><Globe size={24} /></div>
              <div><p className="text-slate-500 text-sm font-medium">Media Online</p><p className="text-2xl font-bold text-slate-800">{stats.online}</p></div>
            </div>
            <div onClick={() => setActiveTab('print')} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center cursor-pointer hover:shadow-md hover:border-blue-200 transition-all group">
              <div className="w-14 h-14 bg-pink-50 text-pink-600 rounded-xl flex items-center justify-center mr-4 group-hover:scale-110 transition-transform"><Newspaper size={24} /></div>
              <div><p className="text-slate-500 text-sm font-medium">Media Cetak</p><p className="text-2xl font-bold text-slate-800">{stats.print}</p></div>
            </div>
            <div onClick={() => setActiveTab('dashboard')} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center cursor-pointer hover:shadow-md hover:border-blue-200 transition-all group">
              <div className="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center mr-4 group-hover:scale-110 transition-transform"><Activity size={24} /></div>
              <div><p className="text-slate-500 text-sm font-medium">Total Isu</p><p className="text-2xl font-bold text-slate-800">{stats.total}</p></div>
            </div>
          </div>

          {/* Baris Kedua: Kategori Isu (BarChart) & Status Penanganan (PieChart) */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 lg:col-span-2">
              <h3 className="font-bold text-slate-800 mb-6 flex items-center"><BarChart2 className="mr-2 text-slate-400" /> Distribusi Kategori Isu</h3>
              <div className="h-64">
                {stats.categoryIssueData.length > 0 ? (
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={stats.categoryIssueData} margin={{ top: 5, right: 20, left: -20, bottom: 40 }}>
                      <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                      <XAxis dataKey="name" tick={{fontSize: 10, fill: '#64748b'}} interval={0} angle={-30} textAnchor="end" />
                      <YAxis allowDecimals={false} tick={{fontSize: 11, fill: '#64748b'}} axisLine={false} tickLine={false} />
                      <RechartsTooltip cursor={{fill: '#f8fafc'}} contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} />
                      <Bar dataKey="total" fill="#8b5cf6" radius={[4, 4, 0, 0]} barSize={35} />
                    </BarChart>
                  </ResponsiveContainer>
                ) : (<div className="h-full flex items-center justify-center text-slate-400 text-sm">Belum ada data kategori.</div>)}
              </div>
            </div>

              <div className="flex justify-center gap-3 mt-4 flex-wrap">

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[400px]">
              <h3 className="font-bold text-slate-800 mb-4 flex items-center"><Building className="mr-2 text-slate-400" size={18}/> Rekap Perangkat Daerah</h3>
              <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-3">

                   <div key={sector.name} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100 hover:bg-blue-50 transition-colors">

                      <span className="bg-blue-100 text-blue-700 font-bold text-xs px-2.5 py-1 rounded-full shrink-0">{sector.total} Isu</span>
                   </div>
                ))}
                {stats.sectorData.length === 0 && <p className="text-sm text-slate-500 text-center py-4">Belum ada data</p>}
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[400px]">
              <h3 className="font-bold text-slate-800 mb-4 flex items-center"><Activity className="mr-2 text-slate-400" size={18} /> Komposisi Sentimen</h3>
              <div className="flex-1 min-h-0">
                <ResponsiveContainer width="100%" height="100%">
                  <RechartsPieChart>
                    <Pie data={stats.sentimentData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value">
                      {stats.sentimentData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} />)}
                    </Pie>
                    <RechartsTooltip />
                  </RechartsPieChart>
                </ResponsiveContainer>
              </div>
              <div className="flex justify-center gap-4 mt-4 shrink-0">
                {stats.sentimentData.map(item => (
                  <div key={item.name} className="flex items-center text-sm"><span className="w-3 h-3 rounded-full mr-2" style={{ backgroundColor: item.color }}></span>{item.name} ({item.value})</div>
                ))}
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[400px]">
              <h3 className="font-bold text-slate-800 mb-4 flex items-center"><Calendar className="mr-2 text-slate-400" size={18} /> Isu Terbaru</h3>
              <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-4">
                {filteredIssues.slice(0, 10).map(issue => (
                  <div key={issue.id} className="p-4 bg-slate-50 rounded-xl border border-slate-100 hover:shadow-sm transition-shadow">
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-[10px] font-bold text-slate-500 bg-white px-2 py-1 rounded border border-slate-200">{issue.sourceType}</span>
                      <span className="text-[10px] text-slate-400">{issue.date}</span>
                    </div>
                    <h4 className="font-bold text-slate-800 text-sm line-clamp-2">{issue.title}</h4>
                    <div className="mt-2 flex flex-wrap gap-2">
                       <span className="text-[10px] text-blue-600 bg-blue-50 px-2 py-1 rounded-md font-medium">{(issue.leadingSectors || [issue.leadingSector]).filter(Boolean).join(', ')}</span>
                       <span className={`text-[10px] px-2 py-1 rounded-md font-medium ${issue.sentiment === 'Positif' ? 'bg-emerald-100 text-emerald-700' : issue.sentiment === 'Negatif' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}`}>{issue.sentiment}</span>

    function DataTableView({ title, type, issues, onAdd, onEdit, onDelete, role, onView, onFetchNews, isFetchingNews }) {
      const [searchTerm, setSearchTerm] = useState('');
      
      const filteredIssues = issues.filter(issue => {
        const sectorsStr = (issue.leadingSectors || [issue.leadingSector]).filter(Boolean).join(', ');
        return issue.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
               sectorsStr.toLowerCase().includes(searchTerm.toLowerCase());
      });

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col h-full">
          <div className="p-6 border-b border-slate-100 bg-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sticky top-0 z-10">
            <div>
              <h2 className="text-xl font-bold text-slate-800">{title}</h2>
              <p className="text-sm text-slate-500 mt-1">Total {issues.length} data tersimpan</p>
            </div>
            <div className="flex flex-wrap w-full sm:w-auto items-center gap-3">
              <div className="relative flex-1 sm:w-64">
                <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                <input type="text" placeholder="Cari judul atau sektor..." 
                  className="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                  value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
              </div>
              {role === 'admin' && (
                <>
                  {type === 'Media Online' && onFetchNews && (
                    <button onClick={onFetchNews} disabled={isFetchingNews} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md shadow-emerald-500/20 transition-all flex items-center">
                      {isFetchingNews ? <Loader2 size={18} className="animate-spin mr-1.5" /> : <Globe size={18} className="mr-1.5" />}
                      {isFetchingNews ? 'Menarik...' : 'Tarik Berita'}
                    </button>
                  )}
                  <button onClick={onAdd} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md shadow-blue-500/20 transition-all flex items-center">
                    <Plus size={18} className="mr-1.5" /> Tambah
                  </button>
                </>
              )}
            </div>
          </div>

          <div className="overflow-x-auto p-4">
            <table className="w-full text-left text-sm whitespace-nowrap">
              <thead className="bg-slate-50 text-slate-600">
                <tr>
                  <th className="p-4 font-semibold rounded-tl-lg">Tanggal</th>
                  <th className="p-4 font-semibold">Judul Isu</th>
                  <th className="p-4 font-semibold">Leading Sector</th>
                  <th className="p-4 font-semibold text-center">Sentimen</th>
                  <th className="p-4 font-semibold text-center">Status</th>
                  <th className="p-4 font-semibold text-right rounded-tr-lg">Aksi</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {filteredIssues.map((issue) => (
                  <tr key={issue.id} className="hover:bg-slate-50 transition-colors group">
                    <td className="p-4 text-slate-600">{issue.date}</td>
                    <td className="p-4 font-medium text-slate-800 max-w-[250px] truncate" title={issue.title}>{issue.title}</td>
                    <td className="p-4 text-slate-600 max-w-[150px] truncate" title={(issue.leadingSectors || [issue.leadingSector]).filter(Boolean).join(', ')}>
                        {(issue.leadingSectors || [issue.leadingSector]).filter(Boolean).join(', ')}
                    </td>
                    <td className="p-4 text-center">
                      <span className={`inline-flex px-2.5 py-1 rounded-full text-xs font-bold ${
                        issue.sentiment === 'Positif' ? 'bg-emerald-100 text-emerald-700' :
                        issue.sentiment === 'Negatif' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'
                      }`}>{issue.sentiment}</span>
                    </td>
                    <td className="p-4 text-center">
                      <span className={`inline-flex px-2.5 py-1 rounded-full text-xs font-bold ${
                        issue.status === 'Selesai' ? 'bg-emerald-100 text-emerald-700' :
                        issue.status === 'Dalam Proses' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-700'
                      }`}>{issue.status || 'Belum Ditangani'}</span>
                    </td>
                    <td className="p-4 text-right opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                      <button onClick={() => onView(issue)} className="p-2 text-slate-400 hover:text-blue-600 rounded-lg mr-1"><Eye size={16} /></button>
                      {role === 'admin' && (
                        <>
                          <button onClick={() => onEdit(issue)} className="p-2 text-slate-400 hover:text-amber-600 rounded-lg mr-1"><Edit2 size={16} /></button>
                          <button onClick={() => onDelete(issue.id)} className="p-2 text-slate-400 hover:text-red-600 rounded-lg"><Trash2 size={16} /></button>
                        </>
                      )}
                    </td>
                  </tr>
                ))}
                {filteredIssues.length === 0 && (
                  <tr><td colSpan="6" className="p-8 text-center text-slate-500">Tidak ada data.</td></tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function AnalysisView({ issues, role, agency, onAnalyze, analyzingId, onView, onPublishToggle, onEditAnalysis, onDelete, onDownloadAll, onDownloadRecap }) {
      const [filterPeriod, setFilterPeriod] = useState('all');
      const [filterMedia, setFilterMedia] = useState('');

      const issuesForAnalysis = issues.filter(issue => {
        if (role !== 'admin' && role !== 'pimpinan' && !issue.analysisPublished) return false;
        if (filterMedia && issue.sourceType !== filterMedia) return false;
        
        if (filterPeriod !== 'all' && issue.date) {
            const issueDate = new Date(issue.date);
            const now = new Date();
            if (filterPeriod === 'today') {
                if (issueDate.toDateString() !== now.toDateString()) return false;
            } else if (filterPeriod === 'week') {
                const diffTime = Math.abs(now - issueDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays > 7) return false;
            } else if (filterPeriod === 'month') {
                if (issueDate.getMonth() !== now.getMonth() || issueDate.getFullYear() !== now.getFullYear()) return false;
            }
        }

        if (role === 'admin' || role === 'pimpinan') return true;
        const sectors = issue.leadingSectors || (issue.leadingSector ? [issue.leadingSector] : []);
        return sectors.includes(agency) && issue.aiAnalysis;
      });

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
          <div className="mb-6 flex flex-col md:flex-row md:justify-between md:items-end gap-4 border-b border-slate-100 pb-6">
            <div>
              <h2 className="text-xl font-bold text-slate-800 flex items-center">
                <Brain className="mr-2 text-blue-600" /> Analisis Isu
              </h2>
            </div>
            <div className="flex flex-wrap gap-3 items-end">
              {role === 'admin' && (
                <div className="flex gap-2">
                  <button onClick={() => onDownloadRecap(issuesForAnalysis)} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm flex items-center transition-colors h-[38px]">
                    <FileText size={16} className="mr-2"/> Rekap Data
                  </button>
                  <button onClick={() => onDownloadAll(issuesForAnalysis)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm flex items-center transition-colors h-[38px]">
                    <Download size={16} className="mr-2"/> Semua Analisis
                  </button>
                </div>
              )}
              <div className="flex flex-col">
                <label className="text-[10px] font-bold text-slate-500 mb-1">Periode Waktu</label>
                <select className="border px-3 py-1.5 rounded-lg text-sm outline-none bg-white h-[38px]" value={filterPeriod} onChange={(e)=>setFilterPeriod(e.target.value)}>
                  <option value="all">Semua Waktu</option><option value="today">Hari Ini</option><option value="week">1 Minggu Terakhir</option><option value="month">Bulan Ini</option>
                </select>
              </div>
              <div className="flex flex-col">
                <label className="text-[10px] font-bold text-slate-500 mb-1">Filter Media</label>
                <select className="border px-3 py-1.5 rounded-lg text-sm outline-none bg-white h-[38px]" value={filterMedia} onChange={(e)=>setFilterMedia(e.target.value)}>
                  <option value="">Semua Media</option><option value="Media Sosial">Media Sosial</option><option value="Media Online">Media Online</option><option value="Media Cetak">Media Cetak</option>
                </select>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {issuesForAnalysis.map(issue => {
              const isThisAnalyzing = analyzingId === issue.id;
              const isAnyAnalyzing = analyzingId !== null;

              return (
                <div key={issue.id} className="bg-white border border-slate-200 rounded-xl p-5 hover:shadow-md transition-shadow flex flex-col relative overflow-hidden">
                  {!issue.analysisPublished && role === 'admin' && <div className="absolute top-0 right-0 bg-amber-100 text-amber-700 text-[10px] font-bold px-3 py-1 rounded-bl-lg">DRAFT</div>}
                  {issue.analysisPublished && <div className="absolute top-0 right-0 bg-emerald-100 text-emerald-700 text-[10px] font-bold px-3 py-1 rounded-bl-lg">PUBLISHED</div>}
                  
                  <div className="flex justify-between items-center mb-3 mt-2">
                    <div className="flex gap-2">
                      <span className="text-[10px] font-bold px-2 py-1 bg-white border border-slate-200 rounded text-slate-600">{issue.sourceType}</span>
                      <span className={`text-[10px] font-bold px-2 py-1 rounded ${issue.sentiment === 'Positif' ? 'bg-emerald-100 text-emerald-700' : issue.sentiment === 'Negatif' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}`}>{issue.sentiment}</span>
                    </div>
                    <span className="text-[10px] text-slate-400 font-medium">{issue.date}</span>
                  </div>
                  
                  <h3 className="font-bold text-slate-800 text-sm mb-2 line-clamp-2">{issue.title}</h3>
                  <p className="text-xs text-blue-600 font-medium mb-4 flex-1">{(issue.leadingSectors || [issue.leadingSector]).filter(Boolean).join(', ')}</p>
                  
                  <div className="mt-auto space-y-2">
                    {issue.aiAnalysis ? (
                      <>
                        <div className="flex gap-2">
                          <button onClick={() => onView(issue)} className="flex-1 py-2 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg text-xs font-bold flex justify-center items-center transition-colors">
                            <Eye size={14} className="mr-1.5"/> Lihat Detail
                          </button>
                          {role === 'admin' && (
                            <>
                              <button onClick={() => onEditAnalysis(issue)} className="px-3 py-2 bg-amber-50 text-amber-600 hover:bg-amber-100 rounded-lg transition-colors" title="Edit Manual Analisis">
                                  <Edit2 size={14}/>
                              </button>
                              <button onClick={() => onAnalyze(issue)} disabled={isAnyAnalyzing} className="px-3 py-2 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg transition-colors" title="Analisis Ulang Isu">
                                  {isThisAnalyzing ? <Loader2 size={14} className="animate-spin"/> : <Brain size={14}/>}
                              </button>
                              <button onClick={() => onDelete(issue.id)} className="px-3 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg transition-colors" title="Hapus Isu">
                                  <Trash2 size={14}/>
                              </button>
                            </>
                          )}
                        </div>
                        {role === 'admin' && (
                          <button onClick={() => onPublishToggle(issue.id, issue.analysisPublished)} 
                            className={`w-full py-2.5 rounded-lg text-xs font-bold flex justify-center items-center transition-colors mt-1 ${issue.analysisPublished ? 'bg-slate-100 text-slate-600 hover:bg-slate-200' : 'bg-emerald-600 text-white hover:bg-emerald-700'}`}>
                            {issue.analysisPublished ? 'Unpublish' : <><Send size={14} className="mr-1.5"/> Publish</>}
                          </button>
                        )}
                      </>
                    ) : (
                      role === 'admin' && (
                        <div className="flex gap-2">
                          <button onClick={() => onAnalyze(issue)} disabled={isAnyAnalyzing} 
                            className="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold shadow-sm transition-all flex items-center justify-center disabled:opacity-50">
                            {isThisAnalyzing ? <Loader2 size={14} className="animate-spin mr-2"/> : <Brain size={14} className="mr-2"/>}
                            {isThisAnalyzing ? 'Menganalisis...' : 'Analisis AI'}
                          </button>
                          <button onClick={() => onDelete(issue.id)} className="px-3 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg transition-colors" title="Hapus Isu">
                              <Trash2 size={14}/>
                          </button>
                        </div>
                      )
                    )}
                  </div>
                </div>
              );
            })}
            {issuesForAnalysis.length === 0 && (
              <div className="col-span-full py-12 text-center">
                 <Brain className="mx-auto h-12 w-12 text-slate-300 mb-3"/>
                 <p className="text-slate-500">Tidak ada isu yang tersedia untuk ditampilkan.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function IssueModal({ type, onClose, onSave, initialData, isUploading }) {
      const [formData, setFormData] = useState(() => {
        const defaultData = initialData || {
          sourceType: type,
          title: '', date: new Date().toISOString().split('T')[0],
          sentiment: 'Netral', leadingSector: LEADING_SECTORS[0],
          issueCategory: 'Birokrasi',
          platform: '', postType: '', account: '', link: '', caption: '',
          domain: '', content: '',
          printType: '', mediaName: '', comments: []
        };
        
        let defaultPostType = defaultData.postType || 'Post Foto/Video/Teks';
        if (['Komentar', 'Ulasan', 'Post Foto/Video'].includes(defaultPostType)) {
            defaultPostType = 'Post Foto/Video/Teks';
        }

        const initialCat = defaultData.issueCategory || 'Birokrasi';
        const isCustomCat = !ISSUE_CATEGORIES.includes(initialCat) && initialCat !== 'Lainnya';

        return {
          ...defaultData,
          leadingSectors: defaultData.leadingSectors || (defaultData.leadingSector ? [defaultData.leadingSector] : [LEADING_SECTORS[0]]),
          issueCategory: isCustomCat ? 'Lainnya' : initialCat,
          customIssueCategory: isCustomCat ? initialCat : '',
          links: defaultData.links || (defaultData.link ? [defaultData.link] : ['']),
          domains: defaultData.domains || (defaultData.domain ? [defaultData.domain] : ['']),
          platforms: defaultData.platforms || (defaultData.platform ? [defaultData.platform] : ['Instagram']),
          accounts: defaultData.accounts || (defaultData.account ? [defaultData.account] : ['']),
          postType: defaultPostType,
          comments: defaultData.comments || []
        };
      });
      
      const [file, setFile] = useState(null);

      const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

      const handleArrayChange = (field, index, value) => {
          const newArr = [...(formData[field] || [])];
          newArr[index] = value;
          setFormData({ ...formData, [field]: newArr });
      };
      
      const addArrayItem = (field, defaultVal) => {
          setFormData({ ...formData, [field]: [...(formData[field] || []), defaultVal] });
      };
      
      const removeArrayItem = (field, index) => {
          const newArr = (formData[field] || []).filter((_, i) => i !== index);
          setFormData({ ...formData, [field]: newArr });
      };

      const handleCommentChange = (index, field, value) => {
          const newComments = [...(formData.comments || [])];
          if (!newComments[index]) newComments[index] = { sentiment: 'Netral', account: '', content: '' };
          newComments[index][field] = value;
          setFormData({ ...formData, comments: newComments });
      };
      
      const addCommentItem = () => {
          setFormData({ ...formData, comments: [...(formData.comments || []), { sentiment: 'Netral', account: '', content: '' }] });
      };
      
      const removeCommentItem = (index) => {
          const newComments = (formData.comments || []).filter((_, i) => i !== index);
          setFormData({ ...formData, comments: newComments });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const finalCategory = formData.issueCategory === 'Lainnya' ? formData.customIssueCategory : formData.issueCategory;
        const dataToSave = { ...formData, issueCategory: finalCategory };
        delete dataToSave.customIssueCategory;
        onSave(dataToSave, file);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div className="bg-slate-50 px-6 py-4 flex justify-between items-center border-b border-slate-100">
              <h3 className="text-xl font-bold text-slate-800">{initialData ? 'Edit Data' : 'Tambah Data'} {type}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X size={24} /></button>
            </div>
            
            <form onSubmit={handleSubmit} className="p-6 overflow-y-auto custom-scrollbar space-y-5">
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm font-medium text-slate-700 mb-1">Tanggal</label><input type="date" name="date" required value={formData.date} onChange={handleChange} className="w-full px-3 py-2 border rounded-xl outline-none" /></div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">
                    {type === 'Media Sosial' ? 'Sentimen Postingan' : 'Sentimen'}
                  </label>
                  <select name="sentiment" value={formData.sentiment} onChange={handleChange} className="w-full px-3 py-2 border rounded-xl outline-none bg-white">
                    <option value="Positif">Positif</option><option value="Netral">Netral</option><option value="Negatif">Negatif</option>
                  </select>
                </div>
              </div>
              
              <div><label className="block text-sm font-medium text-slate-700 mb-1">Judul Isu</label><input type="text" name="title" required value={formData.title} onChange={handleChange} className="w-full px-3 py-2 border rounded-xl outline-none" /></div>
              
              <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <div className="flex flex-col gap-2">
                      <label className="text-xs font-bold text-slate-700">Kategori Isu</label>
                      <select name="issueCategory" value={formData.issueCategory} onChange={handleChange} className="w-full px-3 py-2 text-sm border rounded-xl outline-none bg-white">
                          {ISSUE_CATEGORIES.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                      </select>
                      {formData.issueCategory === 'Lainnya' && (

    function AnalysisEditModal({ issue, onClose, onSave, isUploading }) {
      const [analysis, setAnalysis] = useState(issue.aiAnalysis?.analysis || '');
      const [policy, setPolicy] = useState(issue.aiAnalysis?.policyRecommendation || '');
      const [publication, setPublication] = useState(issue.aiAnalysis?.publicationRecommendation || '');

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-3xl shadow-2xl overflow-hidden flex flex-col max-h-[95vh]">
            <div className="bg-amber-500 px-6 py-4 flex justify-between items-center text-white"><h3 className="text-base font-bold flex items-center"><Edit2 size={16} className="mr-2"/> Edit Manual Analisis & Rekomendasi</h3><button onClick={onClose} className="hover:text-amber-200"><X size={18} /></button></div>
            <div className="p-6 overflow-y-auto custom-scrollbar space-y-4">
               <div><label className="block text-[11px] font-bold text-slate-700 mb-1">Deskripsi Analisis Isu</label><textarea rows="5" value={analysis} onChange={e => setAnalysis(e.target.value)} className="w-full px-3 py-2 text-sm border rounded-xl outline-none"></textarea></div>
               <div><label className="block text-[11px] font-bold text-slate-700 mb-1">Rekomendasi Kebijakan</label><textarea rows="5" value={policy} onChange={e => setPolicy(e.target.value)} className="w-full px-3 py-2 text-sm border rounded-xl outline-none"></textarea></div>
               <div><label className="block text-[11px] font-bold text-slate-700 mb-1">Rekomendasi Publikasi</label><textarea rows="5" value={publication} onChange={e => setPublication(e.target.value)} className="w-full px-3 py-2 text-sm border rounded-xl outline-none"></textarea></div>
            </div>
            <div className="bg-slate-50 border-t p-4 flex justify-end gap-2"><button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-200 font-bold rounded-xl">Batal</button><button onClick={() => onSave(issue.id, { analysis, policyRecommendation: policy, publicationRecommendation: publication })} disabled={isUploading} className="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold rounded-xl flex items-center">{isUploading ? <Loader2 size={16} className="animate-spin mr-1.5"/> : <Save size={16} className="mr-1.5"/>} Simpan Perubahan</button></div>
          </div>

      );

    function App() {
      const [user, setUser] = useState(null);
      const [userRole, setUserRole] = useState('pd');
      const [userProfile, setUserProfile] = useState(null);
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [issues, setIssues] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      
      const [isIssueModalOpen, setIsIssueModalOpen] = useState(false);
      const [editingIssue, setEditingIssue] = useState(null);
      const [viewingIssue, setViewingIssue] = useState(null);
      const [handlingIssue, setHandlingIssue] = useState(null);
      const [analyzingId, setAnalyzingId] = useState(null);
      const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
      const [isUploading, setIsUploading] = useState(false);
      const [isFetchingNews, setIsFetchingNews] = useState(false);
      const [showNotifPanel, setShowNotifPanel] = useState(false);
      const [editingAnalysisIssue, setEditingAnalysisIssue] = useState(null);

      const showToast = (message, type = 'info') => {
        setToast({ show: true, message: typeof message === 'string' ? message : "Terjadi kesalahan", type });
        setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 4000);
      };

      useEffect(() => {
        if (!auth) { setIsLoading(false); return; }
        const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
          try {
            if (currentUser) {
              setUser(currentUser);
              const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'info');
              const docSnap = await getDoc(docRef);
              if (docSnap.exists()) {
                setUserRole(docSnap.data().role || 'pd');
                setUserProfile(docSnap.data());
              }
            } else {
              setUser(null); setUserRole('pd'); setUserProfile(null);
            }
          } catch (err) {
            if(err.code === 'auth/custom-token-mismatch') console.warn("Abaikan auto-login");
          } finally { setIsLoading(false); }
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user || !db) return;
        const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'issues'), orderBy('createdAt', 'desc'));
        const unsubscribe = onSnapshot(q, (snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setIssues(data);
        }, (error) => { showToast("Gagal memuat data", "error"); });
        return () => unsubscribe();
      }, [user]);

      const notifications = useMemo(() => {
        if (!userProfile) return [];
        const sorted = [...issues].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
        
        if (userRole === 'admin' || userRole === 'pimpinan') {
          return sorted.slice(0, 10);
        } 
        else {
          return sorted.filter(i => {
            const sectors = i.leadingSectors || (i.leadingSector ? [i.leadingSector] : []);
            return sectors.includes(userProfile.agency);
          }).slice(0, 10);
        }
      }, [issues, userProfile, userRole]);

      const handleLogout = async () => { if (auth) await signOut(auth); };

      const uploadFileToStorage = async (file, pathPrefix) => {
        if (!storage) return null;
        return new Promise((resolve, reject) => {
          const fileName = `${pathPrefix}_${Date.now()}_${file.name}`;
          const storageRef = ref(storage, `issues_attachments/${fileName}`);
          const uploadTask = uploadBytesResumable(storageRef, file);
          uploadTask.on('state_changed', null, (error) => reject(error), 
            async () => { const downloadURL = await getDownloadURL(uploadTask.snapshot.ref); resolve(downloadURL); }
          );
        });
      };

      const saveIssue = async (issueData, attachmentFile) => {
        if (userRole !== 'admin') return;
        try {
          setIsUploading(true);
          let attachmentUrl = issueData.attachmentUrl || null;
          if (attachmentFile) attachmentUrl = await uploadFileToStorage(attachmentFile, 'issue');
          
          const finalData = { ...issueData, attachmentUrl, updatedAt: new Date().toISOString() };
          if (editingIssue) {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'issues', editingIssue.id), finalData);
            showToast("Diperbarui", "success");
          } else {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'issues'), { ...finalData, status: 'Belum Ditangani', createdAt: new Date().toISOString() });
            showToast("Ditambahkan", "success");
          }
          setIsIssueModalOpen(false); setEditingIssue(null);
        } catch (error) { showToast("Gagal", "error"); } finally { setIsUploading(false); }
      };

      const deleteIssue = async (id) => {
        if (userRole !== 'admin') return;
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'issues', id));
          showToast("Dihapus", "success");
        } catch (error) { showToast("Gagal", "error"); }
      };

      const saveHandlingUpdate = async (status, notes, attachmentFile) => {
        if (!handlingIssue) return;
        try {
          setIsUploading(true);
          let handlingAttachmentUrl = handlingIssue.handlingAttachmentUrl || null;
          if (attachmentFile) handlingAttachmentUrl = await uploadFileToStorage(attachmentFile, 'handling');

          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'issues', handlingIssue.id), {

      const handleAnalyzeAI = async (issue) => {
        if (userRole !== 'admin') return;
        setAnalyzingId(issue.id); 
        showToast("AI sedang menganalisis...", "info");
        
        try {
          const sectorsStr = (issue.leadingSectors || [issue.leadingSector]).filter(Boolean).join(', ');
          
          let additionalContext = '';
          let instructionContext = '';
          if (issue.sourceType === 'Media Sosial') {
              let commentsStr = (issue.comments || []).map((c, i) => `${i+1}. [${c.sentiment}] @${c.account || 'anonim'}: ${c.content}`).join('\n');
              if (commentsStr) {
                  additionalContext = `\n\nKomentar Netizen:\n${commentsStr}`;
                  instructionContext = ` Khusus untuk isu media sosial ini, berikan analisis yang mempertimbangkan baik isi postingan (caption) maupun pola respon/sentimen komentar netizen yang ada.`;
              }
          }

          const prompt = `Sebagai analis kebijakan ahli Pemerintah Kota Bandung, analisislah isu berikut:
Judul: ${issue.title}
Kategori Isu: ${issue.issueCategory || '-'}
Detail: ${issue.content || issue.caption || 'Tidak ada detail'}
Sektor: ${sectorsStr}${additionalContext}

Tugas Anda:
1. Buat 'analysis' (Analisis Isu) mendalam (2 paragraf) tentang akar masalah dan dampaknya.${instructionContext}
2. Buat 'policyRecommendation' (Rekomendasi Kebijakan) untuk Pemkot Bandung di era kepemimpinan Muhammad Farhan. Buat dalam daftar bernomor. Setiap poin WAJIB diawali dengan kata kerja "Me...".
3. Buat 'publicationRecommendation' (Rekomendasi Publikasi). Buat dalam daftar bernomor. Setiap poin WAJIB diawali dengan kata kerja "Me...".

Format KELUARAN HARUS berupa JSON murni dengan struktur: 
{"analysis": "...", "policyRecommendation": "1. Me...\\n2. Me...", "publicationRecommendation": "1. Me...\\n2. Me..."}`;

          let aiResult = null;
          
          try {
            if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("MASUKKAN")) {
              const payload = {
                 messages: [
                     { role: 'system', content: 'You are a helpful policy analyst assistant. Always respond with raw valid JSON.' },
                     { role: 'user', content: prompt }
                 ]
              };

              const response = await fetch(GOOGLE_SCRIPT_URL, { 
                  method: 'POST', 
                  headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                  body: JSON.stringify(payload) 
              });
              
              const textResult = await response.text();
              let jsonResult;
              
              try { jsonResult = JSON.parse(textResult); } catch (e) { throw new Error("Respons Backend tidak valid."); }

              if (jsonResult.error) throw new Error(typeof jsonResult.error === 'string' ? jsonResult.error : (jsonResult.error.message || "Error dari API"));

              let rawContent = "{}";
              if (jsonResult.choices && jsonResult.choices.length > 0) rawContent = jsonResult.choices[0].message.content;
              else if (jsonResult.status === 'success') rawContent = jsonResult.data;
              else throw new Error("Format respons tidak dikenali dari server AI.");

              let cleanData = rawContent.replace(/```json/g, '').replace(/```/g, '').trim();
              aiResult = JSON.parse(cleanData);
            } else {
              throw new Error("URL Backend belum diatur di kode.");
            }
          } catch (backendError) {
            console.warn("Info Backend:", backendError.message);
            showToast("Backend bermasalah/API Key belum diset. Beralih ke AI Cadangan gratis...", "info");
            
            const apiKey = ""; 
            const geminiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: { analysis: { type: "STRING" }, policyRecommendation: { type: "STRING" }, publicationRecommendation: { type: "STRING" } },
                            required: ["analysis", "policyRecommendation", "publicationRecommendation"]
                        }
                    }
                })
            });
            
            const geminiTextRes = await geminiRes.text();
            let geminiData;
            try { geminiData = JSON.parse(geminiTextRes); } catch (e) { throw new Error("API Gemini mengembalikan respons tidak valid."); }
            if (geminiData.error) throw new Error(geminiData.error.message);
            
            let geminiOutput = geminiData.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
            geminiOutput = geminiOutput.replace(/```json/g, '').replace(/```/g, '').trim();
            try { aiResult = JSON.parse(geminiOutput); } catch (e) { throw new Error("Gagal membaca hasil analisis AI Cadangan."); }
          }

          if (aiResult) {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'issues', issue.id), { aiAnalysis: aiResult, analyzedAt: new Date().toISOString() });
            showToast("Analisis AI selesai", "success");
          }
        } catch (error) { 
            console.error("Detail Error Analisis:", error); showToast("Gagal analisis. " + error.message, "error"); 
        } finally { setAnalyzingId(null); }
      };
